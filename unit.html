<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flox — Юнит</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap&subset=cyrillic" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<!-- 14.07.26: только для живого обновления сердечка между уже открытыми
     вкладками (см. subscribeUnitLikeRealtime) — сама страница по-прежнему
     работает и без этой библиотеки (обычные fetch-запросы никуда не делись). -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#0d0d18;--surface:#111118;--surface-2:#1a1a26;--surface-3:#222232;
  --line:rgba(255,255,255,0.06);--line-2:rgba(255,255,255,0.1);
  --text:#ffffff;--muted:rgba(255,255,255,0.45);
  --accent:#5E17EB;--accent-soft:rgba(94,23,235,0.18);
  --green:#7BAF6E;--red:#FF6B6B;--red-soft:rgba(255,107,107,0.15);--green-soft:rgba(123,175,110,0.15);
  --project-color:#5E17EB;
}
/* Цвета статусов в светлой (клиентской) теме приведены к тем же оттенкам,
   что и в offer.html (#15803d / #dc2626), чтобы "Свободен"/"Продан"
   выглядели одинаково в подборке и на странице юнита. */
body.light{
  --bg:#F5F5F7;--surface:#ffffff;--surface-2:#F5F5F7;--surface-3:#EBEBED;
  --line:rgba(0,0,0,0.06);--line-2:rgba(0,0,0,0.1);
  --text:#1a1a1a;--muted:rgba(0,0,0,0.45);
  --accent:#5E17EB;--accent-soft:rgba(94,23,235,0.1);
  --green:#15803d;--red:#dc2626;--red-soft:#fee2e2;--green-soft:#dcfce7;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}

/* ── предупреждение внизу страницы (только клиентский режим) ── */
/* То же самое предупреждение, что и в offer.html: тёмно-синий фон (тот же
   #1C1C2E, что и у .client-topbar вверху страницы), белый текст.
   Скрыто по умолчанию — показывается из JS только когда isClientMode,
   агенту оно не нужно. 14.07.26: отступ до плашки перенесён из margin-top
   в padding-top (см. тот же фикс в offer.html) — иначе при коротком
   контенте (мало похожих вариантов) над плашкой торчала полоса белого
   фона страницы; теперь это пространство закрашено тем же тёмным цветом. */
.footer-notice{display:none;border-top:0.5px solid var(--line);padding:56px 20px 24px;background:#1C1C2E;}
.footer-notice-text{max-width:640px;margin:0 auto;text-align:center;font-size:12.5px;line-height:1.6;color:#fff;}


/* ── КЛИЕНТСКАЯ ШАПКА (белый лейбл, без брендинга Flox) ── */
/* Показывается вместо обычной внутренней панели (topbar.js — поиск,
   инструменты, клиенты, аккаунт агента), когда страница открыта клиентом
   по ссылке из подборки (?client=1) — там эта навигация не нужна и не
   должна быть видна человеку, который не является агентом. */
.client-topbar{background:#1C1C2E;padding:14px 20px;display:none;align-items:center;gap:11px}
.client-avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.client-agent-name{color:#fff;font-size:13px;font-weight:500}

/* ── бегущая строка "недавно продано" (только клиентский режим) ── */
/* Клиентский режим всегда светлая тема (см. isClientMode ниже), поэтому
   тут просто используются обычные переменные — они уже разрешаются в
   светлые значения сами по себе. */
.ticker-wrap{border-bottom:0.5px solid var(--line-2);background:var(--surface-2);overflow:hidden;white-space:nowrap;padding:8px 0;}
.ticker-track{display:inline-flex;gap:28px;animation:scrollTicker 32s linear infinite;padding-left:16px;will-change:transform;}
.ticker-wrap:hover .ticker-track{animation-play-state:paused;}
@keyframes scrollTicker{from{transform:translate3d(0,0,0);}to{transform:translate3d(-50%,0,0);}}
.tick{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);white-space:nowrap;}
/* Отдельный класс (не .dot!) — .dot ниже завязан на анимацию "маяка" у
   статуса "Свободен"; если переиспользовать его тут, кружки в бегущей
   строке тоже начинают мигать, хотя это не задумано. */
.tick .tick-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.tick b{color:var(--text);font-weight:600;}
.tick .ago{color:var(--muted);opacity:.7;}

/* ── LAYOUT ── */
/* Раньше левый отступ (.main padding), зазор между колонками (.main
   padding-right + .sidebar padding-left) и правый отступ (.sidebar
   padding-right) были тремя РАЗНЫМИ значениями (24 / 44 / 20) — из-за
   этого расстояния выглядели неровными. Теперь единый зазор задаёт grid-gap,
   а сами .main/.sidebar отвечают только за внешний край (левый/правый) —
   везде одно и то же число, и верхний отступ (padding-top) тоже общий. */
/* Раньше .sidebar сам скроллился внутри себя (overflow-y:auto + фиксированный
   max-height) — из-за этого при коротком контенте в .main казалось, что
   "скроллится только правая колонка": страница целиком помещалась в экран,
   а сайдбар просто был единственным, что вообще прокручивалось, если его
   содержимое не влезало. Теперь скроллится вся страница целиком, обычным
   образом — ни планировка, ни блок цены НЕ закреплены (без position:sticky):
   при скролле обе колонки уезжают вверх вместе, как единое целое, потому
   что обе начинаются на одной высоте и обе — часть одного обычного потока
   документа. #sidebarSticky больше не sticky по имени, оставлен просто как
   контейнер (id не переименовывали, чтобы не трогать лишний код). */
.page-body{display:grid;grid-template-columns:1fr 300px;gap:24px;min-height:calc(100vh - 64px)}
.main{padding:24px 0 24px 24px;display:flex;flex-direction:column;gap:20px}
.sidebar{padding:24px 24px 24px 0}
#sidebarSticky{display:flex;flex-direction:column;gap:12px}
/* #sidebarSpacer — просто отступ перед первой карточкой сайдбара, чтобы она
   стартовала на той же высоте, что и планировка слева (см.
   alignSidebarToPlan()); margin-bottom добивает зазор до величины gap
   внутри #sidebarSticky, раз сам спейсер вне этого flex-контейнера. */
#sidebarSpacer{margin-bottom:12px}

/* ── UNIT HEADER ── */
/* align-items:flex-end — когда в клиентском режиме плашка статуса
   переезжает сюда же (см. JS), она выравнивается по нижней строке шапки
   (по "VKC217 · 2 спальни"), а не по заголовку проекта. В агентском режиме
   в шапке всего один ребёнок, так что align-items тут ни на что не влияет. */
.unit-header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.unit-project-name{font-size:28px;font-weight:700;margin-bottom:4px;color:var(--text)}
.unit-name{font-size:15px;font-weight:600;color:var(--muted)}
.unit-meta{font-size:13px;color:var(--muted)}
.status-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap}
.badge-avail{background:var(--green-soft);color:var(--green)}
.badge-sold{background:var(--red-soft);color:var(--red)}
/* Точка слева от статуса — "двухтоновое дыхание": яркость и насыщенность
   плавно перетекают из приглушённого тона в яркий и обратно, с лёгким
   изменением размера — свечение целиком внутри самой точки, без внешнего
   кольца/ореола (это уже не "маяк"). currentColor берёт цвет из инлайнового
   color, заданного вместе с background там, где точка рендерится. */
.dot{width:6px;height:6px;border-radius:50%;position:relative;animation:glow-pulse 2.2s ease-in-out infinite}
@keyframes glow-pulse{
  0%,100%{filter:brightness(0.75) saturate(0.7);transform:scale(0.92);}
  50%{filter:brightness(1.5) saturate(1.4);transform:scale(1.08);}
}

/* ── ACTIONS ── */
.actions{display:flex;gap:8px;flex-wrap:wrap}
.act-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;border:0.5px solid var(--line-2);background:var(--surface);font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;font-family:inherit;transition:all .15s}
.act-btn:hover{border-color:var(--text);color:var(--text)}

/* ── TWO-COL ── */
/* Просто оборачивает планировку и блоки из проекта (#projectBlocksWrap)
   одним контейнером друг под другом — без какой-либо фиксации. */
.two-col{display:block}

/* ── PLAN ── */
/* Без position:sticky — планировка просто часть обычного потока страницы
   и уезжает вверх при скролле вместе со всем остальным (как и блок цены
   справа), а не остаётся висеть на месте. */
.plan-card{position:relative;background:#ffffff;border:0.5px solid var(--line-2);border-radius:12px;overflow:hidden;height:480px;display:flex;align-items:center;justify-content:center}
.plan-card img{width:100%;height:100%;object-fit:contain;position:absolute;inset:0}
.plan-placeholder{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted)}
.plan-placeholder i{font-size:56px}
.plan-placeholder span{font-size:13px}
.plan-track{display:flex;width:100%;height:100%;position:absolute;inset:0;transition:transform .3s ease}
.plan-slide{flex:0 0 100%;position:relative;width:100%;height:100%}
.plan-slide img{width:100%;height:100%;object-fit:contain;position:absolute;inset:0}
.plan-slide-label{position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.55);color:#fff;font-size:11px;font-weight:500;padding:4px 10px;border-radius:20px;z-index:2}
.plan-dots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:2}
.plan-dot{width:6px;height:6px;border-radius:50%;background:rgba(0,0,0,0.2);transition:background .2s}
.plan-dot.act{background:rgba(0,0,0,0.65)}
.plan-arrow{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,0.9);border:0.5px solid var(--line-2);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3;color:#1a1a1a;font-size:20px;transition:background .15s,opacity .15s;box-shadow:0 2px 8px rgba(0,0,0,0.12)}
.plan-arrow:hover{background:#fff}
.plan-arrow.left{left:12px}
.plan-arrow.right{right:12px}
.plan-arrow.disabled{opacity:0;pointer-events:none}

/* Сердечко "нравится" (только клиентский режим) — справа сверху в блоке
   планировки. Элемент лежит прямо в #planCard (не в .plan-track), поэтому
   остаётся на месте независимо от того, какой слайд карусели сейчас
   показан (планировка юнита / поэтажный план / мастер-план). Показывается
   из JS вместе с остальными клиентскими элементами (см. isClientMode).
   Цвет и анимация — как у аналогичного сердечка в offer.html. 14.07.26:
   убрали круглую белую подложку (background+box-shadow) — просто иконка
   поверх картинки, без "кружка-кнопки" вокруг. */
.unit-like-plan{
  display:none;position:absolute;top:12px;right:12px;z-index:5;
  width:32px;height:32px;
  align-items:center;justify-content:center;
  font-size:17px;color:var(--muted);cursor:pointer;
  transition:color .2s ease,transform .15s ease;
}
.unit-like-plan.show{display:flex;}
.unit-like-plan:hover{color:var(--red);transform:scale(1.12);}
.unit-like-plan.liked{color:var(--red);animation:heart-pop-plan .5s ease;}
@keyframes heart-pop-plan{
  0%{transform:scale(1);}
  45%{transform:scale(1.45);}
  100%{transform:scale(1);}
}

/* ── PARAMS ── */
.params-card{background:var(--surface);border:0.5px solid var(--line-2);border-radius:12px;overflow:hidden}
.p-row{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:0.5px solid var(--line);font-size:13px}
.p-row:last-child{border-bottom:none}
.p-label{color:var(--muted)}
.p-val{font-weight:500}

/* ── SIDEBAR CARDS ── */
.sc{background:var(--surface);border:0.5px solid var(--line-2);border-radius:12px;padding:14px;transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease}
.sc:hover{transform:scale(1.02);box-shadow:0 6px 20px rgba(0,0,0,0.1)}
.sc.accent-border{border-color:var(--line-2)}
.sc-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.sc-price{font-size:26px;font-weight:700;margin-bottom:2px}
.sc-price-exact{font-size:12px;color:var(--muted);margin-bottom:11px}
.sc-row{display:flex;justify-content:space-between;font-size:12px;padding:9px 0;border-bottom:0.5px solid var(--line)}
.sc-row:last-child{border-bottom:none}
.sc-row span{color:var(--muted)}
.sc-row b{font-weight:600;color:var(--text)}
.sc-row .green{color:var(--green)}
.sc-row .red{color:var(--red)}

.rew-pct{font-size:22px;font-weight:700;margin:4px 0 8px}
.rew-row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0}
.rew-row span{color:var(--muted)}
.rew-row b{font-weight:500}
.rew-btn{display:block;width:100%;padding:8px;border-radius:8px;border:0.5px solid var(--line-2);background:none;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;text-align:center;margin-top:10px;font-family:inherit;transition:all .15s}
.rew-btn:hover{color:var(--text);border-color:var(--line)}

/* ── ADD TO PRESENTATION ── */
.add-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px;border-radius:10px;background:var(--accent);color:#fff;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s}
.book-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px;border-radius:10px;background:none;color:var(--muted);border:0.5px solid var(--line-2);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.book-btn:hover{color:var(--text);border-color:var(--line)}
.add-btn:hover{opacity:.88}
.add-btn.added{background:var(--green);opacity:1}

/* ── КЛИЕНТСКИЕ ДЕЙСТВИЯ (бронь / запись на показ) ── */
.client-book-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border-radius:10px;background:var(--accent);color:#fff;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s,transform .15s,box-shadow .18s ease}
.client-book-btn:hover{opacity:.9;transform:translateY(-1px)}
.client-book-btn i{display:inline-block}
.client-viewing-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border-radius:10px;background:none;color:var(--text);border:1.5px solid var(--accent);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.client-viewing-btn:hover{background:var(--accent-soft);transform:translateY(-1px)}
.client-viewing-btn i{display:inline-block}
/* После успешной брони/записи кнопка "зеленеет" — понятный сигнал
   "заявка принята", без анимации-приглашения нажать (она больше не нужна). */
.client-book-btn.confirmed{background:var(--green)}
.client-viewing-btn.confirmed{border-color:var(--green);color:var(--green)}
/* У "Записаться на показ" фон при наведении завязан на var(--accent-soft)
   (светло-фиолетовый) — это правильно ДО подтверждения (рамка ещё
   фиолетовая), но после подтверждения рамка/текст зеленеют, а фон при
   наведении оставался прежним фиолетовым — разнобой. Здесь фон при
   наведении тоже зеленеет, в цвет рамки. */
.client-viewing-btn.confirmed:hover{background:var(--green-soft)}

/* ── "Металлический" блик ── */
/* Раз в несколько секунд по кнопке пробегает косая светлая полоса — сама
   по себе, независимо от того, наведён на неё курсор или нет (не hover-
   эффект). Применяется к обеим клиентским кнопкам и к агентским
   "Забронировать"/"Добавить в презентацию". У "Подробнее" в offer.html
   осталась своя прежняя анимация (дышащее свечение + стрелка) — её не
   трогаем. */
.client-book-btn,.client-viewing-btn,.add-btn,.book-btn{position:relative;overflow:hidden}
.client-book-btn::after,.client-viewing-btn::after,.add-btn::after,.book-btn::after{
  content:'';position:absolute;top:0;left:0;width:30%;height:100%;
  background:linear-gradient(115deg,transparent 0%,rgba(255,255,255,.65) 50%,transparent 100%);
  transform:translateX(-350%) skewX(-20deg);
  animation:shine-sweep 3.4s ease-in-out infinite;
  pointer-events:none;
}
.client-book-btn:hover::after,.client-viewing-btn:hover::after,.add-btn:hover::after,.book-btn:hover::after{animation-play-state:paused}
/* После успешного действия блик больше не нужен — кнопка просто зелёная. */
.client-book-btn.confirmed::after,.client-viewing-btn.confirmed::after,.add-btn.added::after{display:none}
@keyframes shine-sweep{
  0%{transform:translateX(-350%) skewX(-20deg);}
  35%,100%{transform:translateX(450%) skewX(-20deg);}
}

/* Оверлей + шторка снизу с календарём */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .25s ease}
.drawer-overlay.open{opacity:1;pointer-events:auto}
.drawer{background:var(--surface);width:100%;max-width:420px;border-radius:20px 20px 0 0;padding:20px;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);max-height:86vh;overflow-y:auto}
.drawer-overlay.open .drawer{transform:translateY(0)}
@media (min-width:520px){
  .drawer-overlay{align-items:center}
  .drawer{border-radius:20px;transform:translateY(24px) scale(.97);opacity:0}
  .drawer-overlay.open .drawer{transform:translateY(0) scale(1);opacity:1}
}
.drawer-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.drawer-title{font-size:16px;font-weight:700}
.drawer-close{width:30px;height:30px;border-radius:50%;border:none;background:var(--surface-2);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px}
.drawer-close:hover{color:var(--text)}

.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-nav-btn{width:30px;height:30px;border-radius:8px;border:0.5px solid var(--line-2);background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer}
.cal-nav-btn:disabled{opacity:.25;cursor:default}
.cal-nav-btn:not(:disabled):hover{border-color:var(--accent)}
.cal-month-label{font-size:13px;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;font-size:11px;color:var(--muted);padding:4px 0;font-weight:600}
.cal-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:13px;cursor:pointer;transition:background .15s,color .15s}
.cal-cell:not(.empty):not(.past):hover{background:var(--accent-soft)}
.cal-cell.past{color:var(--muted);opacity:.3;cursor:default}
.cal-cell.selected{background:var(--accent);color:#fff;font-weight:700}
.cal-cell.empty{cursor:default}

.drawer-confirm{display:block;width:100%;padding:12px;border-radius:10px;background:var(--accent);color:#fff;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:16px;transition:opacity .15s}
.drawer-confirm:disabled{opacity:.35;cursor:default}
.drawer-confirm:not(:disabled):hover{opacity:.9}

/* Оверлей успешного действия */
.success-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:110;opacity:0;pointer-events:none;transition:opacity .25s ease}
.success-overlay.open{opacity:1;pointer-events:auto}
.success-box{background:var(--surface);border-radius:18px;padding:28px 24px;max-width:340px;text-align:center;transform:scale(.94);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.success-overlay.open .success-box{transform:scale(1)}
.success-icon{font-size:40px;color:var(--green);margin-bottom:12px}
.success-text{font-size:14px;line-height:1.5;margin-bottom:18px}
.success-close{padding:10px 24px;border-radius:10px;background:var(--accent);color:#fff;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.success-close:hover{opacity:.9}

/* ── LOADING ── */
.loading{display:flex;align-items:center;justify-content:center;min-height:300px}
.spinner{width:28px;height:28px;border:2px solid var(--line-2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── БЛОКИ ИЗ ПРОЕКТА (перенесены из project.html) ──────────────────────────
   Ниже планировки могут идти те же блоки, что агент выбирал на вкладке
   "Название презентации" во flox web при создании презентации (developer,
   description, nearby/карта, gallery, payment_schedule, maintenance, files —
   см. renderProjectBlocks). В клиентском режиме показываются только те,
   что агент отметил для этого проекта; в агентском — всегда все. Стили и
   разметка максимально повторяют project.html, чтобы блоки выглядели
   привычно и узнаваемо. */
#projectBlocksWrap{margin-top:20px}
.proj-block{padding-top:24px}
.proj-block:first-child{padding-top:0}
.sec-title{font-size:13px;font-weight:600;margin-bottom:18px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

.desc-text{font-size:14px;line-height:1.8;color:var(--text);margin-bottom:24px}
.facilities-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px;margin-bottom:24px}
.fac-item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;display:flex;align-items:center;gap:8px;transition:transform .2s cubic-bezier(.34,1.56,.64,1),border-color .2s,box-shadow .2s;cursor:default}
.fac-item:hover{transform:scale(1.04);border-color:var(--project-color);box-shadow:0 4px 16px rgba(94,23,235,0.12)}
.fac-icon{font-size:18px}
.info-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;transition:transform .2s cubic-bezier(.34,1.56,.64,1);cursor:default}
.info-row:hover{transform:translateX(4px)}
.info-row:last-child{border-bottom:none}
.info-label{color:var(--muted)}
.info-val{font-weight:600}

.map-wrap{border-radius:14px;overflow:hidden;border:1px solid var(--line);margin-bottom:20px}
.nearby-list{display:flex;flex-direction:column;gap:8px}
.nearby-item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px;transition:border-color .2s,background .2s,transform .2s cubic-bezier(.34,1.56,.64,1)}
.nearby-item:hover{border-color:var(--project-color);background:var(--surface-2);transform:scale(1.02)}
.nearby-icon{font-size:20px;width:30px;text-align:center}
.nearby-name{font-size:13px;font-weight:500;flex:1}
.nearby-dist{text-align:right}
.nearby-dist-val{font-size:12px;font-weight:600}
.nearby-time{font-size:11px;color:var(--muted)}

.visual-tabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.visual-tab{padding:6px 16px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--line-2);color:var(--muted);transition:all .2s cubic-bezier(.34,1.56,.64,1);background:none;font-family:inherit}
.visual-tab:hover{border-color:var(--project-color);color:var(--project-color);transform:scale(1.06)}
.visual-tab.act{background:var(--project-color);border-color:var(--project-color);color:#fff}
.visual-panel{display:none}
.visual-panel.act{display:block}
.visual-slider{position:relative;overflow:hidden;border-radius:12px;background:var(--surface-2);user-select:none;aspect-ratio:16/9}
.visual-slides{display:flex;transition:transform .35s cubic-bezier(.4,0,.2,1);height:100%}
.visual-slide{min-width:100%;height:100%;flex-shrink:0}
.visual-slide img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;transition:transform .4s cubic-bezier(.4,0,.2,1)}
.visual-slide:hover img{transform:scale(1.04)}
.visual-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.45);border:none;color:#fff;width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;z-index:2;line-height:1}
.visual-arrow:hover{background:rgba(0,0,0,0.75)}
.visual-arrow.prev{left:12px}
.visual-arrow.next{right:12px}
.visual-counter{position:absolute;bottom:12px;right:14px;font-size:11px;color:rgba(255,255,255,0.75);background:rgba(0,0,0,0.4);padding:3px 10px;border-radius:20px}

.white-card{background:var(--surface);border:0.5px solid var(--line-2);border-radius:12px;overflow:hidden}
.white-card .ps-timeline{padding:20px 16px 0}
.white-card .ps-table{border-top:none}
.ps-timeline{display:flex;align-items:flex-start;margin-bottom:24px;overflow-x:auto;padding-bottom:4px;gap:0;scrollbar-width:none}
.ps-timeline::-webkit-scrollbar{display:none}
.ps-step{flex:1;min-width:72px;text-align:center;position:relative;padding-bottom:4px;transition:transform .2s cubic-bezier(.34,1.56,.64,1);cursor:default}
.ps-step:hover{transform:scale(1.12)}
.ps-circle-wrap{position:relative;width:56px;height:56px;margin:0 auto 8px;z-index:1}
.ps-circle-wrap svg{transform:rotate(-90deg)}
.ps-circle-track{stroke:var(--line-2);fill:none;stroke-width:3}
.ps-circle-fill{fill:none;stroke-width:3;stroke-linecap:round;stroke:var(--project-color);stroke-dasharray:145;stroke-dashoffset:145;transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1)}
.ps-circle-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--project-color)}
.ps-step-label{font-size:10px;color:var(--muted);line-height:1.4;margin-top:4px;word-break:keep-all}
.ps-table{width:100%;border-collapse:collapse}
.ps-table th{text-align:left;padding:10px 14px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:0.5px solid var(--line)}
.ps-table tbody tr:first-child td{border-top:none}
.ps-table td{padding:12px 14px;font-size:13px;border-bottom:1px solid var(--line)}
.ps-table tr:last-child td{border-bottom:none}
.ps-pct{font-weight:700;color:var(--project-color);font-size:15px}

.maint-row{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);font-size:13px;gap:24px;transition:transform .2s cubic-bezier(.34,1.56,.64,1),background .15s;cursor:default}
.maint-row:hover{transform:translateX(4px);background:var(--surface-2)}
.maint-row:last-child{border-bottom:none}
.maint-label{color:var(--muted);flex:1}
.maint-val{font-weight:600;flex-shrink:0;text-align:right}
.maint-note{margin-top:14px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:12px;color:var(--muted);line-height:1.6}

.files-list{display:flex;flex-direction:column;gap:8px}
.file-item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 16px;text-decoration:none;color:var(--text);transition:border-color .2s,background .2s,transform .2s cubic-bezier(.34,1.56,.64,1)}
.file-item:hover{border-color:var(--project-color);background:var(--surface-2);transform:scale(1.02)}
.file-icon{font-size:22px}
.file-name{font-size:13px;font-weight:500;flex:1}
.file-type{font-size:11px;color:var(--muted);background:var(--surface-2);padding:2px 7px;border-radius:5px}
.file-arrow{color:var(--muted)}

.lightbox{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,0.92);align-items:center;justify-content:center}
.lightbox.open{display:flex}
.lb-img{max-width:90vw;max-height:88vh;object-fit:contain;border-radius:8px}
.lb-close{position:absolute;top:16px;right:20px;color:#fff;font-size:28px;cursor:pointer;line-height:1;background:rgba(0,0,0,0.4);border:none;border-radius:8px;width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.lb-prev,.lb-next{position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:22px;cursor:pointer;background:rgba(0,0,0,0.5);border:none;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.lb-prev:hover,.lb-next:hover{background:rgba(0,0,0,0.8)}
.lb-prev{left:16px}
.lb-next{right:16px}
.lb-counter{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.7);font-size:12px;background:rgba(0,0,0,0.4);padding:4px 12px;border-radius:20px}
</style>
</head>
<body>

<div id="flox-topbar" data-page="unit"></div>
<div class="client-topbar" id="clientTopbar">
  <div class="client-avatar" id="clientAvatar"></div>
  <div class="client-agent-name" id="clientAgentName"></div>
</div>

<!-- Бегущая строка "недавно продано" — только в клиентском режиме (см. JS) -->
<div class="ticker-wrap" id="soldTickerWrap" style="display:none">
  <div class="ticker-track" id="soldTicker"></div>
</div>

<!-- Шторка записи на показ — календарь без прошедших дат -->
<div class="drawer-overlay" id="viewingOverlay">
  <div class="drawer" id="viewingDrawer">
    <div class="drawer-header">
      <div class="drawer-title">Выберите дату показа</div>
      <button class="drawer-close" id="viewingClose" type="button"><i class="ti ti-x"></i></button>
    </div>
    <div class="cal-nav">
      <button class="cal-nav-btn" id="calPrev" type="button"><i class="ti ti-chevron-left"></i></button>
      <div class="cal-month-label" id="calMonthLabel"></div>
      <button class="cal-nav-btn" id="calNext" type="button"><i class="ti ti-chevron-right"></i></button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <button class="drawer-confirm" id="viewingConfirm" type="button" disabled>Подтвердить</button>
  </div>
</div>

<!-- Оверлей с сообщением об успешной брони/записи -->
<div class="success-overlay" id="successOverlay">
  <div class="success-box">
    <div class="success-icon"><i class="ti ti-circle-check"></i></div>
    <div class="success-text" id="successText"></div>
    <button class="success-close" id="successClose" type="button">Понятно</button>
  </div>
</div>

<!-- Лайтбокс для фото/рендеров проекта (см. renderGalleryBlock) -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" onclick="closeLightbox()">✕</button>
  <button class="lb-prev" onclick="lbNav(-1)">‹</button>
  <img class="lb-img" id="lbImg" src="" alt=""/>
  <button class="lb-next" onclick="lbNav(1)">›</button>
  <div class="lb-counter" id="lbCounter"></div>
</div>

<div class="page-body">
  <div class="main" id="mainContent">
    <div class="loading"><div class="spinner"></div></div>
  </div>
  <div class="sidebar" id="sidebarContent">
    <div class="loading"><div class="spinner"></div></div>
  </div>
</div>

<div class="footer-notice" id="footerNotice">
  <div class="footer-notice-text">
    Наличие юнитов может измениться в любой момент — актуальный статус лучше уточнять у вашего агента
  </div>
</div>

<script>
const SUPABASE_URL = 'https://lqhuegdwglzkfzjcfxdx.supabase.co/rest/v1';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxxaHVlZ2R3Z2x6a2Z6amNmeGR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MjA5NjIsImV4cCI6MjA5NzM5Njk2Mn0.egEtZ5Av8tAD_Y6tKtWowxpbHoCiDezWEG5gWpEYNpo';
const SB = { apikey: SUPABASE_ANON, Authorization: `Bearer ${SUPABASE_ANON}`, Accept: 'application/json' };


// ── PARAMS ─────────────────────────────────────────────────────────────────
const params = new URLSearchParams(location.search);
const roomNo = params.get('unit');
const projectId = params.get('project');

// Клиентский режим (?client=1) — страница открыта по ссылке из подборки
// (offer.html), а не изнутри агентского интерфейса. Здесь не должно быть
// внутренней навигации (topbar.js — поиск/инструменты/клиенты/аккаунт),
// вознаграждения агента и кнопок "Добавить в презентацию"/"Забронировать" —
// это агентские инструменты, а не то, что нужно видеть покупателю.
const isClientMode = params.get('client') === '1';
const clientAgentInitials = params.get('agent') || '';
const clientAgentName = params.get('agentName') || '';
// id презентации, из которой клиент перешёл по ссылке юнита (offer.html
// добавляет его в каждую ссылку) — нужен, чтобы бронь/запись на показ можно
// было привязать к правильному агенту и клиенту при уведомлении в Telegram.
const presentationId = params.get('pres') || '';

if (isClientMode) {
  // Клиент всегда видит только светлую тему, независимо от того, в какой
  // теме агент открывал эту страницу у себя.
  document.body.classList.add('light');

  const flox = document.getElementById('flox-topbar');
  if (flox) flox.style.display = 'none';
  const ct = document.getElementById('clientTopbar');
  if (clientAgentInitials) {
    document.getElementById('clientAvatar').textContent = clientAgentInitials;
    if (clientAgentName) {
      document.getElementById('clientAgentName').textContent = `${clientAgentName} — ваш личный агент по недвижимости`;
    }
    ct.style.display = 'flex';
  }
  loadSoldTicker();
  // То же предупреждение, что и в оффере (offer.html) — то же в двух
  // словах: наличие юнита не гарантировано, актуальный статус лучше
  // уточнять у агента. В агентском режиме этот блок не нужен — агент и так
  // знает актуальную ситуацию.
  const fn = document.getElementById('footerNotice');
  if (fn) fn.style.display = 'block';
}

// ── Бегущая строка "недавно продано" (только клиентский режим) ──────────────
const PROJ_COLOR = { VIK: '#C9A84C', KAT: '#7BAF6E', BAN: '#6B9BC2', OLN: '#8FAB5F' };
function soldTimeAgo(iso) {
  const mins = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 60000));
  if (mins < 60) return `${mins} мин назад`;
  const hours = Math.floor(mins / 60);
  if (hours < 24) return `${hours} ч назад`;
  const days = Math.floor(hours / 24);
  return `${days} дн назад`;
}
async function loadSoldTicker() {
  try {
    const r = await fetch(`${SUPABASE_URL}/units?status=eq.sold&select=room_no,status_updated_at,projects(code,name)&order=status_updated_at.desc&limit=25`, { headers: SB });
    const rows = await r.json();
    if (!Array.isArray(rows) || !rows.length) return;
    const items = rows.map(u => {
      const code = u.projects?.code || '';
      const color = PROJ_COLOR[code] || 'var(--accent)';
      const projName = u.projects?.name || code;
      return `<span class="tick"><span class="tick-dot" style="background:${color}"></span>ПРОДАНО <b>${u.room_no}</b> · ${projName} <span class="ago">· ${soldTimeAgo(u.status_updated_at)}</span></span>`;
    }).join('');
    const track = document.getElementById('soldTicker');
    track.innerHTML = items + items;
    document.getElementById('soldTickerWrap').style.display = 'block';
    requestAnimationFrame(() => {
      const singleWidth = track.scrollWidth / 2;
      const pxPerSecond = 38;
      track.style.animationDuration = Math.max(10, singleWidth / pxPerSecond) + 's';
    });
  } catch (e) {}
}

function fmtMln(v) {
  const m = v / 1000000;
  return m >= 10 ? m.toFixed(1) + ' млн ฿' : m.toFixed(2).replace(/\.?0+$/, '') + ' млн ฿';
}

// ── LOAD ────────────────────────────────────────────────────────────────────
async function loadUnit() {
  if (!roomNo) { showError('Юнит не указан'); return; }

  try {
    // 1. Загружаем юнит
    const r = await fetch(`${SUPABASE_URL}/units?room_no=eq.${encodeURIComponent(roomNo)}&limit=1`, { headers: SB });
    const rows = await r.json();
    if (!rows.length) {
      // Пробуем без encodeURIComponent на случай двойного кодирования
      const r2 = await fetch(`${SUPABASE_URL}/units?room_no=eq.${roomNo}&limit=1`, { headers: SB });
      const rows2 = await r2.json();
      if (!rows2.length) { showError('Юнит не найден: ' + roomNo); return; }
      return processUnit(rows2[0]);
    }
    processUnit(rows[0]);
  } catch(e) {
    showError('Ошибка загрузки: ' + e.message);
  }
}

async function processUnit(u) {
  // 2. Загружаем проект из Supabase по project_id
  let proj = { code: projectId || '', name: '' };
  if (u.project_id) {
    try {
      const pr = await fetch(`${SUPABASE_URL}/projects?id=eq.${u.project_id}&limit=1`, { headers: SB });
      const pd = await pr.json();
      if (pd.length) proj = pd[0];
    } catch(e) {}
  }

  // 3. Загружаем JSON проекта для доп. данных
  let projData = null;
  const code = proj.code || projectId || '';
  if (code) {
    try {
      const base = location.pathname.replace(/\/[^\/]*$/, '/');
      const pj = await fetch(`${base}projects/${code}.json`);
      if (pj.ok) projData = await pj.json();
    } catch(e) {}
  }

  // 4. Блоки из проекта (описание/застройщик/карта/галерея/платежи/
  // обслуживание/файлы) ниже планировки. В агентском режиме показываем
  // все — это внутренний инструмент, фильтровать нечего. В клиентском —
  // только то, что агент отметил для ЭТОГО проекта на шаге "Блоки" при
  // создании презентации (id презентации приходит в ссылке из offer.html
  // как &pres=...). allowedBlocks === null означает "показать все".
  let allowedBlocks = null;
  if (isClientMode && presentationId && code) {
    try {
      const pr = await fetch(`${SUPABASE_URL}/presentations?id=eq.${encodeURIComponent(presentationId)}&select=project_blocks`, { headers: SB });
      const rows = await pr.json();
      const blocksByProject = rows[0]?.project_blocks || {};
      // Если для этого проекта в презентации явно ничего не сохранено —
      // это тот же дефолт, что использует flox web при первом открытии
      // шторки "Поделиться" (см. sharePresentation() в floxweb.html).
      allowedBlocks = blocksByProject[code] || ['project_name', 'developer', 'description', 'payment_schedule'];
    } catch(e) {
      allowedBlocks = ['project_name', 'developer', 'description', 'payment_schedule'];
    }
  }

  renderUnit(u, proj, projData, allowedBlocks);
}

function loadPlanImage(u, proj) {
  const code = proj.code || projectId || '';
  const base = location.pathname.replace(/\/[^\/]*$/, '/');
  const slides = [];

  // Слайд 1: планировка юнита — {площадь}_{plan_code}.jpg
  if (code && u.plan_code && u.area_sqm) {
    const areaStr = Number(u.area_sqm).toFixed(2);
    const fileName = `${areaStr}_${u.plan_code}.jpg`;
    slides.push({
      path: `${base}img/${code}/units/${encodeURIComponent(fileName)}`,
      label: 'Планировка юнита',
      alt: `Планировка ${u.room_no}`
    });
  }

  // Слайд 2: поэтажный план — {корпус кириллицей}{этаж}.jpg, например с5.jpg
  // Соответствие латиница→кириллица: A→а, B→б, C→с, D→д
  const TOWER_CYR = { A: 'а', B: 'б', C: 'с', D: 'д' };
  if (code && u.tower && u.floor) {
    const towerCyr = TOWER_CYR[String(u.tower).toUpperCase()] || String(u.tower).toLowerCase();
    const fileName = `${towerCyr}${u.floor}.jpg`;
    slides.push({
      path: `${base}img/${code}/floor-plans/${encodeURIComponent(fileName)}`,
      label: `Поэтажный план · Корпус ${u.tower} · Этаж ${u.floor}`,
      alt: `Поэтажный план, корпус ${u.tower}, этаж ${u.floor}`
    });
  }

  // Слайд 3: мастер-план — страница (этаж + 1), с ведущими нулями до 4 знаков
  // этаж 1 → page-0002, этаж 8 → page-0009
  if (code && u.floor) {
    const pageNum = String(Number(u.floor) + 1).padStart(4, '0');
    const fileName = `мастер план_page-${pageNum}.jpg`;
    slides.push({
      path: `${base}img/${code}/masterplan/${encodeURIComponent(fileName)}`,
      label: `Мастер-план · Этаж ${u.floor}`,
      alt: `Мастер-план, этаж ${u.floor}`
    });
  }

  if (!slides.length) return; // нет данных вообще — плейсхолдер остаётся

  // Проверяем существование каждого слайда параллельно, сохраняя порядок
  Promise.all(slides.map(s => new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(s);
    img.onerror = () => resolve(null);
    img.src = s.path;
  }))).then(results => {
    const found = results.filter(Boolean);
    if (!found.length) return; // ни один файл не нашёлся — плейсхолдер остаётся
    renderPlanCarousel(found);
  });
}

function renderPlanCarousel(slides) {
  const card = document.getElementById('planCard');
  const placeholder = document.getElementById('planPlaceholder');
  if (!card || !placeholder) return;
  placeholder.remove();

  const track = document.createElement('div');
  track.className = 'plan-track';
  track.id = 'planTrack';

  slides.forEach(s => {
    const slide = document.createElement('div');
    slide.className = 'plan-slide';
    const img = document.createElement('img');
    img.src = s.path;
    img.alt = s.alt;
    slide.appendChild(img);
    track.appendChild(slide);
  });
  card.appendChild(track);

  if (slides.length > 1) {
    const labelEl = document.createElement('div');
    labelEl.className = 'plan-slide-label';
    labelEl.id = 'planSlideLabel';
    labelEl.textContent = slides[0].label;
    card.appendChild(labelEl);

    const dotsEl = document.createElement('div');
    dotsEl.className = 'plan-dots';
    slides.forEach((_, i) => {
      const dot = document.createElement('div');
      dot.className = 'plan-dot' + (i === 0 ? ' act' : '');
      dotsEl.appendChild(dot);
    });
    card.appendChild(dotsEl);

    const arrowLeft = document.createElement('div');
    arrowLeft.className = 'plan-arrow left disabled';
    arrowLeft.innerHTML = '<i class="ti ti-chevron-left"></i>';
    card.appendChild(arrowLeft);

    const arrowRight = document.createElement('div');
    arrowRight.className = 'plan-arrow right';
    arrowRight.innerHTML = '<i class="ti ti-chevron-right"></i>';
    card.appendChild(arrowRight);

    initPlanSwipe(card, track, slides, dotsEl, labelEl, arrowLeft, arrowRight);
  }
}

function initPlanSwipe(card, track, slides, dotsEl, labelEl, arrowLeft, arrowRight) {
  let current = 0;
  let startX = 0;
  let deltaX = 0;
  let dragging = false;

  function goTo(idx) {
    current = Math.max(0, Math.min(slides.length - 1, idx));
    track.style.transform = `translateX(-${current * 100}%)`;
    labelEl.textContent = slides[current].label;
    [...dotsEl.children].forEach((d, i) => d.classList.toggle('act', i === current));
    arrowLeft.classList.toggle('disabled', current === 0);
    arrowRight.classList.toggle('disabled', current === slides.length - 1);
  }

  arrowLeft.addEventListener('click', () => goTo(current - 1));
  arrowRight.addEventListener('click', () => goTo(current + 1));

  card.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    dragging = true;
    track.style.transition = 'none';
  }, { passive: true });

  card.addEventListener('touchmove', e => {
    if (!dragging) return;
    deltaX = e.touches[0].clientX - startX;
    track.style.transform = `translateX(calc(-${current * 100}% + ${deltaX}px))`;
  }, { passive: true });

  card.addEventListener('touchend', () => {
    dragging = false;
    track.style.transition = 'transform .3s ease';
    if (Math.abs(deltaX) > 60) {
      goTo(current + (deltaX < 0 ? 1 : -1));
    } else {
      goTo(current);
    }
    deltaX = 0;
  });

  // Поддержка свайпа мышью на десктопе (drag)
  card.addEventListener('mousedown', e => {
    startX = e.clientX;
    dragging = true;
    track.style.transition = 'none';
  });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    deltaX = e.clientX - startX;
    track.style.transform = `translateX(calc(-${current * 100}% + ${deltaX}px))`;
  });
  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    track.style.transition = 'transform .3s ease';
    if (Math.abs(deltaX) > 60) {
      goTo(current + (deltaX < 0 ? 1 : -1));
    } else {
      goTo(current);
    }
    deltaX = 0;
  });
}

// ── БЛОКИ ИЗ ПРОЕКТА (перенесены из project.html) ───────────────────────────
// Каждая функция строит один блок ниже планировки юнита. Ключи соответствуют
// PRES_BLOCKS в floxweb.html (developer/description/nearby/gallery/
// payment_schedule/maintenance/files) — project_name отдельным блоком не
// рисуется, потому что название проекта и так всегда есть в шапке юнита.
function renderProjectBlocks(pd, allowed) {
  if (!pd) return '';
  const show = key => !allowed || allowed.includes(key);
  const parts = [];
  // Порядок: описание + инфраструктура, потом детали проекта, дальше как
  // было (карта, галерея, платежи, обслуживание, файлы).
  if (show('description') && pd.description) parts.push(renderDescriptionBlock(pd));
  if (show('developer') && (pd.developer || (pd.buildings && pd.buildings.length) || pd.completion)) parts.push(renderDeveloperBlock(pd));
  if (show('nearby') && pd.coords && pd.coords.lat) parts.push(renderMapBlock(pd));
  if (show('gallery') && pd.gallery && pd.gallery.local && pd.gallery.local.length) parts.push(renderGalleryBlock(pd));
  if (show('payment_schedule') && pd.payment_schedule && pd.payment_schedule.length) parts.push(`<div id="projPaymentSection">${renderPaymentBlock(pd)}</div>`);
  if (show('maintenance') && pd.maintenance) parts.push(renderMaintBlock(pd));
  if (show('files') && pd.files && pd.files.length) parts.push(renderFilesBlock(pd));
  if (!parts.length) return '';
  return parts.map(p => `<div class="proj-block">${p}</div>`).join('');
}

function renderDescriptionBlock(d) {
  const icons = { 'лагун':'🏖️','детский бассейн':'🐬','джакузи':'♨️','фитнес':'💪','лобби':'🏨','лаундж':'🛋️','парковка':'🅿️','сад':'🌿','барбекю':'🔥','коворкинг':'💻','животных':'🐾','фонтан':'⛲','детск':'👶','прачечная':'🧺','бассейн':'🏊','вода':'💧','охрана':'🔐','зона отдыха':'🌅','спорт':'🎾' };
  const usedIcons = new Set();
  const getIcon = f => {
    const fl = f.toLowerCase();
    for (const [k, v] of Object.entries(icons)) { if (fl.includes(k) && !usedIcons.has(v)) { usedIcons.add(v); return v; } }

  return `

  const total = d.payment_schedule.reduce((s, p) => s + p.percent, 0);
  const stageRu = {
    'Reservation':'Бронирование','Booking deposit':'Депозит',
    'Sign Contract':'Договор','Sign Contract (SPA)':'Договор SPA',
    'Contract payment':'Договор',
    'Foundation Complete':'Фундамент','Foundation':'Фундамент',
    'Structure Complete':'Конструкция','Structure':'Конструкция',
    'Rooftop Complete':'Кровля','Rooftop':'Кровля',

    '1st Installment':'1-й взнос','2nd Installment':'2-й взнос',

  };
  const circ = 2 * Math.PI * 23;

  return `

// ── Слайдер (галерея) — переключение вкладок, лайтбокс, свайпы ─────────────
function switchVisualTab(btn, panelId) {
  const section = btn.closest('.proj-block');
  section.querySelectorAll('.visual-tab').forEach(t => t.classList.remove('act'));
  section.querySelectorAll('.visual-panel').forEach(p => p.classList.remove('act'));
  btn.classList.add('act');
  document.getElementById(panelId).classList.add('act');
  const slider = document.querySelector('#' + panelId + ' .visual-slider');
  if (slider) sliderLazyLoad(slider.id, parseInt(slider.dataset.idx));
}
function sliderNav(id, dir) {
  const slider = document.getElementById(id);
  if (!slider) return;
  const count = parseInt(slider.dataset.count);
  let idx = parseInt(slider.dataset.idx);
  idx = (idx + dir + count) % count;
  sliderGoTo(id, idx);
}
function sliderGoTo(id, idx) {
  const slider = document.getElementById(id);
  const slides = document.getElementById(id + '-slides');
  const counter = document.getElementById(id + '-counter');
  if (!slider || !slides) return;
  slider.dataset.idx = idx;
  slides.style.transform = `translateX(-${idx * 100}%)`;
  if (counter) counter.textContent = `${idx + 1} / ${slider.dataset.count}`;
  sliderLazyLoad(id, idx);
}
function sliderLazyLoad(id, idx) {
  const slider = document.getElementById(id);
  if (!slider) return;
  const imgs = slider.querySelectorAll('img');
  [idx - 1, idx, idx + 1].forEach(i => {
    if (i >= 0 && i < imgs.length && imgs[i].dataset.src && !imgs[i].src.includes(imgs[i].dataset.src)) {
      imgs[i].src = imgs[i].dataset.src;
    }
  });
}
function sliderClick(id, idx) {
  const slider = document.getElementById(id);
  if (!slider) return;
  const imgs = [...slider.querySelectorAll('img')].map(i => i.dataset.src || i.src);
  openLightbox(imgs, idx);
}
let _dragStart = null;
function sliderDragStart(e, id) {
  _dragStart = { x: e.clientX, id };
  const onUp = (ev) => {
    if (_dragStart && _dragStart.id === id) {
      const dx = ev.clientX - _dragStart.x;
      if (Math.abs(dx) > 40) sliderNav(id, dx < 0 ? 1 : -1);
    }
    _dragStart = null;
    document.removeEventListener('mouseup', onUp);
  };
  document.addEventListener('mouseup', onUp);
}
let _touchStart = null;
function sliderTouchStart(e, id) {
  _touchStart = { x: e.touches[0].clientX, id };
  const onEnd = (ev) => {
    if (_touchStart && _touchStart.id === id) {
      const dx = ev.changedTouches[0].clientX - _touchStart.x;
      if (Math.abs(dx) > 40) sliderNav(id, dx < 0 ? 1 : -1);
    }
    _touchStart = null;
    document.removeEventListener('touchend', onEnd);
  };
  document.addEventListener('touchend', onEnd);
}

let lbPhotos = [], lbIdx = 0;
function openLightbox(photos, idx) {
  lbPhotos = photos; lbIdx = idx;
  document.getElementById('lightbox').classList.add('open');
  updateLb();
  document.addEventListener('keydown', lbKey);
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.removeEventListener('keydown', lbKey);
}
function lbNav(dir) { lbIdx = (lbIdx + dir + lbPhotos.length) % lbPhotos.length; updateLb(); }
function updateLb() {
  document.getElementById('lbImg').src = lbPhotos[lbIdx];
  document.getElementById('lbCounter').textContent = `${lbIdx + 1} / ${lbPhotos.length}`;
}
function lbKey(e) {
  if (e.key === 'ArrowRight') lbNav(1);
  if (e.key === 'ArrowLeft') lbNav(-1);
  if (e.key === 'Escape') closeLightbox();
}
document.getElementById('lightbox').addEventListener('click', function(e) {
  if (e.target === this) closeLightbox();
});

// ── Анимация графика платежей (кружки-прогресс + проценты) — как в
// project.html: запускается заново КАЖДЫЙ раз, когда блок появляется в
// зоне видимости при скролле (не один раз за всю жизнь страницы). Раньше
// тут был obs.disconnect() после первого срабатывания — уводило в скролл
// мимо блока и обратно, и анимация больше не повторялась. Работает
// одинаково в агентском и клиентском режиме — вызывается безусловно из
// renderUnit(), блок графика платежей есть в обоих режимах. ──────────
function initProjectPaymentAnimation() {
  const section = document.getElementById('projPaymentSection');
  if (!section) return;
  const obs = new IntersectionObserver(entries => {
    if (!entries[0].isIntersecting) return;
    const fills = section.querySelectorAll('.ps-circle-fill');
    fills.forEach(el => { el.style.transition = 'none'; el.style.strokeDashoffset = 145; });
    requestAnimationFrame(() => requestAnimationFrame(() => {
      fills.forEach((el, i) => {
        setTimeout(() => {
          el.style.transition = 'stroke-dashoffset 1s cubic-bezier(.4,0,.2,1)';
          el.style.strokeDashoffset = el.dataset.offset;
        }, i * 200);
      });
    }));
    section.querySelectorAll('.ps-circle-pct').forEach((el, i) => {
      const val = parseFloat(el.dataset.target);
      if (!isNaN(val)) setTimeout(() => animateProjCount(el, val, 1800, v => Math.round(v) + '%'), i * 150);
    });
    section.querySelectorAll('.ps-pct').forEach((el, i) => {
      const val = parseFloat(el.dataset.target);
      if (!isNaN(val)) setTimeout(() => animateProjCount(el, val, 1800, v => Math.round(v) + '%'), i * 150);
    });
  }, { threshold: 0.3 });
  obs.observe(section);
}
function animateProjCount(el, target, duration, formatter) {
  if (!el) return;
  const start = performance.now();
  const step = (now) => {
    const t = Math.min((now - start) / duration, 1);
    const ease = t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
    const val = target * ease;
    el.textContent = formatter ? formatter(val) : Math.round(val).toLocaleString('ru');
    if (t < 1) requestAnimationFrame(step);
    else el.textContent = formatter ? formatter(target) : Math.round(target).toLocaleString('ru');
  };
  requestAnimationFrame(step);
}

function animateRewardAmount(sellingPrice, pct) {
  const el = document.getElementById('rewAmount');
  if (!el || !sellingPrice || !pct) return;
  const target = Math.round(sellingPrice * pct / 100);
  const dur = 900;
  const start = performance.now();
  function step(now) {
    const t = Math.min(1, (now - start) / dur);
    const ease = 1 - Math.pow(1 - t, 3);
    const val = Math.round(target * ease);
    el.textContent = val.toLocaleString('ru') + ' ฿';
    if (t < 1) requestAnimationFrame(step);
    else el.textContent = target.toLocaleString('ru') + ' ฿';
  }
  requestAnimationFrame(step);
}

function alignSidebarToPlan() {
  const topBlock = document.getElementById('unitTopBlock');
  const spacer = document.getElementById('sidebarSpacer');
  if (!topBlock || !spacer) return;
  const mainGap = parseFloat(getComputedStyle(document.querySelector('.main')).rowGap || 20);
  const sidebarStickyEl = document.getElementById('sidebarSticky');
  const sidebarGap = parseFloat((sidebarStickyEl && getComputedStyle(sidebarStickyEl).rowGap) || 12);
  const targetHeight = topBlock.offsetHeight + mainGap - sidebarGap;
  spacer.style.height = Math.max(0, targetHeight) + 'px';
}

// ── КЛИЕНТСКИЕ ДЕЙСТВИЯ: бронь и запись на показ ────────────────────────────
// Пишем напрямую в Supabase (анонимным ключом, как и остальная страница).
// Бот раз в 20 секунд вычитывает новые непрочитанные строки из этих таблиц
// и шлёт уведомление агенту (и администратору) в Telegram — тот же
// проверенный механизм, что уже работает для presentation_views.
let clientUnit = null; // юнит, к которому относится текущая бронь/запись

// ── Сердечко "нравится" (только клиентский режим) ───────────────────────────
// Тот же механизм, что и в offer.html: пишем строку в presentation_likes —
// бот уже опрашивает эту таблицу и шлёт уведомление агенту, а floxweb.html
// подхватывает её в "Последней активности" (никаких доп. правок в боте/
// floxweb.html не требуется). Повторный клик по уже закрашенному сердечку
// снимает лайк (помечает строку unliked=true, саму строку удаляет бот —
// см. telegram_listener.py). Состояние (лайкнуто/нет + id строки в Supabase)
// живёт в localStorage — ключ включает presentationId, а не только roomNo,
// иначе лайк из одной подборки "просачивался" бы в другую с тем же юнитом.
// 14.07.26: перед тем как полагаться на localStorage, сверяемся с Supabase —
// иначе лайк, поставленный клиентом на странице оффера (offer.html), не был
// виден здесь, на странице юнита, и наоборот (та же логика и тот же приём,
// что и в offer.html — см. fetchLikedUnitMap там). Запрос защищённый: если
// не удался (сеть/RLS/таблицы ещё нет) — просто не трогаем localStorage.
async function fetchUnitLikeRowId(presId, unitId) {
  if (!presId || !unitId) return undefined; // undefined = не проверяли (нет данных для запроса)
  try {
    const r = await fetch(`${SUPABASE_URL}/presentation_likes?presentation_id=eq.${presId}&unit_id=eq.${unitId}&select=id,unliked&order=id.desc`, { headers: SB });
    const rows = await r.json();
    if (!Array.isArray(rows)) return undefined; // undefined = запрос не удался
    const active = rows.find(row => !row.unliked);
    return active ? active.id : null; // null = запрос удался, активного лайка нет
  } catch (e) {
    console.error('presentation_likes GET (синхронизация сердечка) network error:', e);
    return undefined;
  }
}

async function initUnitLikeButton() {
  const btn = document.getElementById('unitLikePlan');
  if (!btn || !clientUnit) return;
  btn.classList.add('show');

  const likeKey = `flox-liked-${presentationId || 'direct'}-${roomNo}`;
  const rowIdKey = `flox-liked-id-${presentationId || 'direct'}-${roomNo}`;
  const icon = btn.querySelector('i');

  const dbRowId = await fetchUnitLikeRowId(presentationId, clientUnit?.id);
  if (dbRowId !== undefined) {
    if (dbRowId != null) {
      // Лайк уже стоит в базе (возможно, поставлен на странице оффера) —
      // синхронизируем localStorage, чтобы "снять лайк" дальше работал как обычно.
      localStorage.setItem(likeKey, 'true');
      localStorage.setItem(rowIdKey, dbRowId);
    } else {
      // Запрос удался, активного лайка в базе нет — гасим локальный кэш.
      localStorage.removeItem(likeKey);
      localStorage.removeItem(rowIdKey);
    }
  }

  if (localStorage.getItem(likeKey) === 'true') {
    btn.classList.add('liked');
    if (icon) icon.className = 'ti ti-heart-filled';
  }

  btn.addEventListener('click', async e => {
    e.preventDefault();
    e.stopPropagation();

    if (btn.classList.contains('liked')) {
      // Снимаем лайк
      const rowId = localStorage.getItem(rowIdKey);
      btn.classList.remove('liked');
      if (icon) icon.className = 'ti ti-heart';
      localStorage.removeItem(likeKey);
      localStorage.removeItem(rowIdKey);
      if (!rowId) return; // лайк был поставлен ещё до этого обновления страницы — id неизвестен, снимать в базе нечего
      try {
        const resp = await fetch(`${SUPABASE_URL}/presentation_likes?id=eq.${rowId}`, {
          method: 'PATCH',
          headers: { ...SB, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
          body: JSON.stringify({ unliked: true }),
        });
        if (!resp.ok) console.error('presentation_likes PATCH (снятие лайка) failed:', resp.status, await resp.text());
      } catch (err) {
        console.error('presentation_likes PATCH (снятие лайка) network error:', err);
      }
      return;
    }

    // Ставим лайк
    btn.classList.add('liked');
    if (icon) icon.className = 'ti ti-heart-filled';
    localStorage.setItem(likeKey, 'true');
    try {
      const resp = await fetch(`${SUPABASE_URL}/presentation_likes`, {
        method: 'POST',
        headers: { ...SB, 'Content-Type': 'application/json', Prefer: 'return=representation' },
        body: JSON.stringify({ presentation_id: presentationId || null, unit_id: clientUnit?.id || null }),
      });
      if (!resp.ok) {
        console.error('presentation_likes POST failed:', resp.status, await resp.text());
        return;
      }
      const rows = await resp.json();
      if (rows && rows[0] && rows[0].id != null) localStorage.setItem(rowIdKey, rows[0].id);
    } catch (err) {
      console.error('presentation_likes POST network error:', err);
    }
  });
}

// ── Живое обновление сердечка между открытыми вкладками (Supabase Realtime) ──
// Та же презентация может быть открыта в offer.html в другой вкладке
// одновременно — без этого лайк, поставленный там, появился бы здесь
// только после перезагрузки страницы юнита. Фильтруем события по
// presentation_id на сервере, а по конкретному unit_id — уже на клиенте
// (Realtime не даёт скомбинировать два условия равенства в одном filter).
//
// ВАЖНО: требует включённой репликации для таблицы presentation_likes в
// Supabase (Database → Replication → добавить таблицу в публикацию
// supabase_realtime, см. тот же комментарий в offer.html). Если не
// включено — подписка просто ничего не получает, страница продолжает
// работать как раньше (REST-запросы + сверка с базой при загрузке).
function subscribeUnitLikeRealtime() {
  if (typeof supabase === 'undefined' || !presentationId || !clientUnit) return;
  try {
    const sbClient = supabase.createClient(SUPABASE_URL.replace(/\/rest\/v1\/?$/, ''), SUPABASE_ANON);
    sbClient
      .channel(`presentation_likes:${presentationId}:${clientUnit.id}`)
      .on('postgres_changes', {
        event: '*',
        schema: 'public',
        table: 'presentation_likes',
        filter: `presentation_id=eq.${presentationId}`,
      }, payload => {
        const isDelete = payload.eventType === 'DELETE';
        const row = isDelete ? payload.old : payload.new;
        if (!row || String(row.unit_id) !== String(clientUnit.id)) return; // не наш юнит — игнорируем

        const btn = document.getElementById('unitLikePlan');
        if (!btn) return;
        const icon = btn.querySelector('i');
        const likeKey = `flox-liked-${presentationId || 'direct'}-${roomNo}`;
        const rowIdKey = `flox-liked-id-${presentationId || 'direct'}-${roomNo}`;
        const isActiveLike = !isDelete && !row.unliked;

        if (isActiveLike) {
          btn.classList.add('liked');
          if (icon) icon.className = 'ti ti-heart-filled';
          localStorage.setItem(likeKey, 'true');
          localStorage.setItem(rowIdKey, row.id);
        } else {
          btn.classList.remove('liked');
          if (icon) icon.className = 'ti ti-heart';
          localStorage.removeItem(likeKey);
          localStorage.removeItem(rowIdKey);
        }
      })
      .subscribe();
  } catch (e) {
    console.error('Realtime подписка на presentation_likes не удалась:', e);
  }
}

async function submitBooking() {
  const btn = document.getElementById('clientBookBtn');
  if (btn) { btn.disabled = true; btn.style.opacity = '.6'; }
  try {
    await fetch(`${SUPABASE_URL}/presentation_bookings`, {
      method: 'POST',
      headers: { ...SB, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify({
        presentation_id: presentationId || null,
        unit_id: clientUnit?.id || null,
      }),
    });
  } catch (e) {
    console.error('Не удалось отправить заявку на бронирование', e);
  }
  if (btn) { btn.disabled = false; btn.style.opacity = ''; btn.classList.add('confirmed'); }
  localStorage.setItem('flox-booked-' + roomNo, 'true');
  showSuccess('Поздравляем! Заявка на бронирование отправлена вашему агенту, оставайтесь на связи для дальнейшего оформления.');
}

// ── Календарь для записи на показ (без прошедших дат) ──
let calViewDate = new Date();
let selectedViewingDate = null;
const CAL_MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const CAL_DOW = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

function todayMidnight() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d;
}

function renderCalendar(viewDate) {
  calViewDate = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1);
  const grid = document.getElementById('calGrid');
  const label = document.getElementById('calMonthLabel');
  if (!grid || !label) return;
  label.textContent = `${CAL_MONTHS[calViewDate.getMonth()]} ${calViewDate.getFullYear()}`;

  const today = todayMidnight();
  const firstDay = new Date(calViewDate.getFullYear(), calViewDate.getMonth(), 1);
  const lastDay = new Date(calViewDate.getFullYear(), calViewDate.getMonth() + 1, 0);
  const startOffset = (firstDay.getDay() + 6) % 7; // Пн=0 ... Вс=6

  let html = CAL_DOW.map(d => `<div class="cal-dow">${d}</div>`).join('');
  for (let i = 0; i < startOffset; i++) html += `<div class="cal-cell empty"></div>`;
  for (let d = 1; d <= lastDay.getDate(); d++) {
    const dateObj = new Date(calViewDate.getFullYear(), calViewDate.getMonth(), d);
    const isPast = dateObj < today;
    const iso = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const isSel = selectedViewingDate === iso;
    html += `<div class="cal-cell${isPast ? ' past' : ''}${isSel ? ' selected' : ''}" data-date="${isPast ? '' : iso}">${d}</div>`;
  }
  grid.innerHTML = html;

  grid.querySelectorAll('.cal-cell[data-date]:not([data-date=""])').forEach(cell => {
    cell.addEventListener('click', () => {
      selectedViewingDate = cell.dataset.date;
      grid.querySelectorAll('.cal-cell').forEach(c => c.classList.remove('selected'));
      cell.classList.add('selected');
      const confirmBtn = document.getElementById('viewingConfirm');
      if (confirmBtn) confirmBtn.disabled = false;
    });
  });

  const isCurrentMonth = calViewDate.getFullYear() === today.getFullYear() && calViewDate.getMonth() === today.getMonth();
  const prevBtn = document.getElementById('calPrev');
  if (prevBtn) prevBtn.disabled = isCurrentMonth;
}

function openViewingDrawer() {
  selectedViewingDate = null;
  const confirmBtn = document.getElementById('viewingConfirm');
  if (confirmBtn) confirmBtn.disabled = true;
  renderCalendar(todayMidnight());
  document.getElementById('viewingOverlay')?.classList.add('open');
}
function closeViewingDrawer() {
  document.getElementById('viewingOverlay')?.classList.remove('open');
}
document.getElementById('viewingClose')?.addEventListener('click', closeViewingDrawer);
document.getElementById('viewingOverlay')?.addEventListener('click', e => {
  if (e.target.id === 'viewingOverlay') closeViewingDrawer();
});
document.getElementById('calPrev')?.addEventListener('click', () => {
  renderCalendar(new Date(calViewDate.getFullYear(), calViewDate.getMonth() - 1, 1));
});
document.getElementById('calNext')?.addEventListener('click', () => {
  renderCalendar(new Date(calViewDate.getFullYear(), calViewDate.getMonth() + 1, 1));
});
document.getElementById('viewingConfirm')?.addEventListener('click', async () => {
  if (!selectedViewingDate) return;
  const btn = document.getElementById('viewingConfirm');
  btn.disabled = true;
  try {
    await fetch(`${SUPABASE_URL}/presentation_viewing_requests`, {
      method: 'POST',
      headers: { ...SB, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify({
        presentation_id: presentationId || null,
        unit_id: clientUnit?.id || null,
        requested_date: selectedViewingDate,
      }),
    });
  } catch (e) {
    console.error('Не удалось отправить заявку на показ', e);
  }
  btn.disabled = false;
  document.getElementById('clientViewingBtn')?.classList.add('confirmed');
  localStorage.setItem('flox-viewing-' + roomNo, 'true');
  closeViewingDrawer();
  showSuccess('Поздравляем с успешной записью на просмотр! Скоро агент свяжется с вами для уточнения времени встречи.');
});

// Пояснение при повторном клике на уже подтверждённую бронь/запись на
// показ — переиспользует тот же оверлей, что и showSuccess, но без
// конфетти (это не новое достижение, а просто напоминание, что заявка уже
// отправлена).
function showAlready(text) {
  const textEl = document.getElementById('successText');
  if (textEl) textEl.textContent = text;
  document.getElementById('successOverlay')?.classList.add('open');
}

function showSuccess(text) {
  const textEl = document.getElementById('successText');
  if (textEl) textEl.textContent = text;
  document.getElementById('successOverlay')?.classList.add('open');
  // Конфетти — приятный акцент в момент, когда клиент видит подтверждение
  // брони/записи на показ. window.confetti грузится с CDN; если по какой-то
  // причине скрипт не подгрузился (нет сети до jsdelivr и т.п.) — просто
  // пропускаем анимацию, само сообщение всё равно покажется.
  if (window.confetti) {
    confetti({ particleCount: 120, spread: 75, startVelocity: 45, origin: { y: 0.65 } });
    setTimeout(() => confetti({ particleCount: 60, spread: 100, startVelocity: 30, origin: { y: 0.6 } }), 200);
  }
}
document.getElementById('successClose')?.addEventListener('click', () => {
  document.getElementById('successOverlay')?.classList.remove('open');
});
document.getElementById('successOverlay')?.addEventListener('click', e => {
  if (e.target.id === 'successOverlay') document.getElementById('successOverlay').classList.remove('open');
});

loadUnit();
</script>
