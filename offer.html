<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Подборка — Пхукет</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap&subset=cyrillic" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css"/>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<!-- 14.07.26: только для живого обновления сердечка между уже открытыми
     вкладками (см. subscribeLikeRealtime) — сама страница по-прежнему
     работает и без этой библиотеки (обычные fetch-запросы никуда не делись). -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<!-- 14.07.26: маленькое конфетти у сердечка в момент лайка (та же
     библиотека, что уже используется для конфетти при подтверждении
     брони/записи на показ в unit.html) -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
/* Высота .units полностью считается в JS (см. layoutMasonry) и уже сама
   растёт, когда карточка в нижнем ряду раскрывается при наведении —
   отдельный статический запас снизу не нужен (раньше он был большим и
   создавал много лишнего пустого пространства, когда ничего не наведено).
   padding-bottom раньше добавлял белый отступ снизу "для аккуратного
   завершения страницы" — но теперь страницу завершает .footer-notice
   (тёмная плашка-предупреждение), и этот белый отступ просто торчал под
   ней отдельной полосой. Убран — .footer-notice сама себе довольно
   отступа (padding) и является настоящим концом страницы. */
html,body{background:#fff;font-family:'Inter',system-ui,sans-serif;color:#1C1C2E;-webkit-tap-highlight-color:transparent;}
/* 22.07.26 (2), по просьбе Ильи: JS-снимок высоты (разово досыпанный
   padding-bottom) оказался ненадёжным — если высота контента чуть менялась
   ПОСЛЕ момента вызова (например из-за того, что шрифт Inter догружался и
   слегка сдвигал перенос строк), белая полоса под плашкой возвращалась,
   потому что отступ уже был посчитан под старую, чуть меньшую высоту.
   Вместо разового снимка — узкая flex-обёртка .sticky-footer-wrap ТОЛЬКО
   вокруг #main и .footer-notice (специально не вокруг всего body — там же
   .top-bar/.ticker-wrap/.intro, трогать которые не нужно вообще). JS всего
   раз (и на resize) выставляет ей min-height = "сколько места остаётся от
   её начала до низа экрана" — а дальше #main{flex:1 0 auto} сам живо
   растягивается/уступает место ровно под актуальную высоту контента, каким
   бы он ни стал ПОСЛЕ этого вызова, без необходимости пересчитывать снова. */
.sticky-footer-wrap{display:flex;flex-direction:column;}
#main{flex:1 0 auto;}
:root{
  --night:#1C1C2E;--sand:#fff;--accent:#5E17EB;--red:#FF6B6B;
  /* Раньше --muted был приглушённым ФИОЛЕТОВЫМ (#6B5A9E) — из-за этого
     весь второстепенный текст на странице (подзаголовок под "Подборка для
     Вас", номер юнита на карточке, точная цена, подписи в раскрытом
     инфоблоке) читался лиловым, хотя выглядеть должен был просто серым.
     --line (цвет тонких разделительных линий, например у бегущей строки)
     сознательно оставлен фиолетовым — это акцентная линия, не текст. */
  --muted:rgba(0,0,0,.45);--line:rgba(94,23,235,.12);--white:#ffffff;
}

/* ── общий контейнер страницы ── */
/* На широких экранах контент раньше растягивался на всю ширину окна и
   выглядел расплющенным (карточки шириной под 2000px при высоте плана
   220px). Ограничиваем читаемую область так же, как это сделано в
   project.html/unit.html (там — .body-wrap, max-width:1200px, по центру). */
.page-wrap{max-width:1200px;margin:0 auto;}

/* ── шапка ── */
/* Белый лейбл: клиент не должен видеть брендинг Flox — вместо логотипа
   показываем только инициалы агента, который прислал подборку (если они
   известны). Если инициалов нет — шапку не показываем вовсе. */
.top-bar{background:var(--night);padding:14px 20px;}
.top-bar-inner{display:flex;align-items:center;gap:11px;}
.agent-avatar{
  width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;letter-spacing:.02em;flex-shrink:0;
}
.agent-name{color:#fff;font-size:13px;font-weight:500;}

/* ── вступление ── */
.intro{max-width:1200px;margin:0 auto;padding:28px 20px 22px;}
.intro-title{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px;}
.intro-sub{font-size:13px;color:var(--muted);}

/* ── карточки юнитов ── */
/* Сетка вместо одной сплошной колонки — на мобильном по-прежнему одна
   колонка на всю ширину, а на широких экранах карточки естественно
   выстраиваются в несколько столбцов (тот же приём, что и в units-grid
   на project.html), вместо одной растянутой во всю ширину карточки. */
/* CSS Grid тут не подходит: в гриде высота ВСЕЙ строки завязана на самый
   высокий элемент этой строки, даже с align-items:start — поэтому при
   раскрытии одной карточки съезжали вниз все карточки в этой строке, а не
   только те, что реально под ней. Готовые CSS-колонки (column-count/columns)
   тоже не подходят: браузер балансирует их по суммарной высоте и при
   изменении высоты одной карточки перекидывает карточки МЕЖДУ колонками
   (карточки буквально телепортируются в другую колонку) — это ещё заметнее,
   чем исходная проблема с гридом. Поэтому раскладка строится в JS
   (см. layoutMasonry() ниже): у каждой карточки фиксированная колонка,
   назначенная один раз, а позиция внутри колонки (top) пересчитывается
   покадрово во время раскрытия — двигаются только карточки НИЖЕ раскрытой
   и строго в её же колонке, независимо от масштаба окна браузера. */
.units{
  max-width:1200px;margin:0 auto;padding:16px;
  position:relative;
}
/* Карточка теперь целиком ссылка на страницу юнита — увеличивается при
   наведении, как аналогичные карточки в project.html/floxweb.html.
   position:absolute — раскладку (left/top/width) выставляет JS. */
.unit-card{
  display:block;background:#fff;border-radius:16px;border:0.5px solid var(--line);
  overflow:hidden;text-decoration:none;color:inherit;cursor:pointer;
  position:absolute;top:0;left:0;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease;
}
.unit-card:hover{transform:scale(1.02);box-shadow:0 8px 28px rgba(0,0,0,.1);}
.unit-plan{background:#fff;height:220px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;border-bottom:0.5px solid var(--line);}
.unit-plan img{width:100%;height:100%;object-fit:contain;}
.unit-plan-placeholder{display:flex;flex-direction:column;align-items:center;gap:8px;color:#ccc;}
.unit-plan-placeholder i{font-size:40px;}
.unit-plan-placeholder span{font-size:12px;}
/* карусель */
.unit-track{display:flex;width:100%;height:100%;position:absolute;inset:0;transition:transform .7s cubic-bezier(.4,0,.2,1);}
.unit-slide{flex:0 0 100%;position:relative;width:100%;height:100%;}
.unit-slide img{width:100%;height:100%;object-fit:contain;position:absolute;inset:0;}
.slide-label{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.5);color:#fff;font-size:10px;font-weight:500;padding:3px 8px;border-radius:20px;z-index:2;}
.slide-arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.45);border:0.5px solid rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3;font-size:20px;color:#1C1C2E;transition:opacity .15s,background .15s;box-shadow:0 2px 10px rgba(0,0,0,.08);backdrop-filter:blur(2px);}
.slide-arrow:hover{background:rgba(255,255,255,.9);}
.slide-arrow.left{left:10px;}
.slide-arrow.right{right:10px;}
.slide-arrow.dis{opacity:0;pointer-events:none;}
/* статус-бейдж */
.unit-badge{position:absolute;top:8px;right:8px;display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;z-index:2;}
.badge-avail{background:#dcfce7;color:#15803d;}
.badge-sold{background:#fee2e2;color:#dc2626;}
/* Точка слева от "Свободен" — "двухтоновое дыхание" (тот же приём, что и в
   unit.html/project.html): яркость и насыщенность плавно перетекают из
   приглушённого тона в яркий и обратно, с лёгким изменением размера —
   свечение целиком внутри самой точки, без внешнего кольца/ореола.
   У каждой карточки свой animation-delay (--dot-delay, задаётся инлайн-стилем
   из JS) — иначе все точки на странице дышали бы синхронно, единым импульсом;
   так они разгораются вразнобой, то тут, то там. */
.badge-dot{width:5px;height:5px;border-radius:50%;background:currentColor;position:relative;animation:glow-pulse 2.2s ease-in-out infinite;animation-delay:var(--dot-delay,0s);}
@keyframes glow-pulse{
  0%,100%{filter:brightness(0.75) saturate(0.7);transform:scale(0.92);}
  50%{filter:brightness(1.5) saturate(1.4);transform:scale(1.08);}
}
/* инфо — название проекта, номер, крупная цена и кнопка "Подробнее" видны
   сразу (не только по наведению); а вот точная цена и полные параметры
   (корпус/этаж/тип/площадь и т.д.) скрыты и красиво раскрываются по
   наведению на планировку/сводку — см. .unit-hover-extra ниже. Раскрытие
   управляется классом .expanded (через JS), а не чистым :hover — иначе
   при наведении прямо на кнопку "Подробнее" она бы уезжала вниз из-под
   курсора вместе с раскрывающейся инфой. */
.unit-info{padding:14px 16px;position:relative;}
.unit-summary{cursor:pointer;padding-right:28px;}

/* Сердечко "нравится" — справа сверху в блоке информации (не над
   картинкой, там уже плашка статуса). Цвет — var(--red) (#FF6B6B), тот
   же коралловый, что у точки рядом с логотипом Flox в топбаре. Постоянного
   свечения нет — только короткий "прыжок" в момент клика. Лайк ставится
   один раз — повторный клик снимает лайк (см. обработчик клика), а не
   отправляет уведомление повторно. */
.unit-like{
  position:absolute;top:12px;right:12px;z-index:4;
  width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;color:var(--muted);cursor:pointer;
  transition:color .2s ease,transform .15s ease;
}
.unit-like:hover{color:var(--red);transform:scale(1.12);}
.unit-like.liked{color:var(--red);animation:heart-pop .5s ease;}
@keyframes heart-pop{
  0%{transform:scale(1);}
  45%{transform:scale(1.45);}
  100%{transform:scale(1);}
}
/* Название проекта — крупнее и заметнее номера юнита (номер — как подпись). */
.unit-proj{font-size:16px;font-weight:700;color:var(--night);margin-bottom:2px;letter-spacing:-.01em;}
.unit-num{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;}
.unit-sold-card{opacity:.45;}

/* точная цена + полные параметры — скрыты, раскрываются по наведению */
.unit-hover-extra{
  max-height:0;opacity:0;overflow:hidden;
  transition:max-height .45s cubic-bezier(.4,0,.2,1),opacity .3s ease,margin .45s cubic-bezier(.4,0,.2,1);
}
.unit-card.expanded .unit-hover-extra{max-height:400px;opacity:1;}

/* кнопка "Подробнее" — видна всегда; стрелка покачивается постоянно, а
   металлический блик запускается только при наведении (один проход на
   каждый hover), а не крутится бесконечно сам по себе.
   Цвет — снова акцентный фиолетовый var(--accent) (тёмно-синий вариант не
   прижился). */
.unit-cta{
  position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;gap:6px;
  margin-top:14px;padding:12px;border-radius:10px;
  background:var(--accent);color:#fff;font-size:13px;font-weight:600;
  transition:background .18s ease,transform .18s ease,box-shadow .18s ease;
}
.unit-card:hover .unit-cta{box-shadow:0 6px 16px rgba(94,23,235,.3);}
.unit-cta:hover{background:#4c12c9;transform:translateY(-1px);}
.unit-cta i{display:inline-block;animation:cta-arrow 1.6s ease-in-out infinite;}
.unit-cta::after{
  content:'';position:absolute;top:0;left:0;width:30%;height:100%;
  background:linear-gradient(115deg,transparent 0%,rgba(255,255,255,.65) 50%,transparent 100%);
  transform:translateX(-350%) skewX(-20deg);
  pointer-events:none;
}
.unit-cta:hover::after{animation:shine-sweep .9s ease-in-out;}
@keyframes shine-sweep{
  0%{transform:translateX(-350%) skewX(-20deg);}
  100%{transform:translateX(450%) skewX(-20deg);}
}
@keyframes cta-arrow{
  0%,100%{transform:translateX(0);}
  50%{transform:translateX(4px);}
}

/* ── блок цены и параметров ── */
/* Скопировано из блока "Цена" в unit.html (sc/sc-price/sc-row), кроме
   строки "Проект" — она не нужна, название проекта уже стоит заголовком
   выше (.unit-proj). Так карточка в оффере несёт столько же информации,
   сколько и страница юнита. */
.unit-price-big{font-size:22px;font-weight:700;margin-bottom:2px;}
.unit-price-exact{font-size:12px;color:var(--muted);margin-bottom:12px;}
.unit-full-rows{border-top:0.5px solid var(--line);}
.unit-full-row{display:flex;justify-content:space-between;font-size:12px;padding:9px 0;border-bottom:0.5px solid var(--line);}
.unit-full-row:last-child{border-bottom:none;}
.unit-full-row span{color:var(--muted);}
.unit-full-row b{font-weight:600;}
.unit-full-row b.green{color:#15803d;}
.unit-full-row b.red{color:#dc2626;}

/* ── бегущая строка "недавно продано" ── */
/* Оффер всегда светлый, поэтому строка тут светлая без привязки к теме
   (в отличие от floxweb.html, где она подстраивается под тему сайта). */
.ticker-wrap{border-top:0.5px solid var(--line);border-bottom:0.5px solid var(--line);background:#F8F7FB;overflow:hidden;white-space:nowrap;padding:8px 0;}
.ticker-track{display:inline-flex;gap:28px;animation:scrollTicker 32s linear infinite;padding-left:16px;will-change:transform;}
.ticker-wrap:hover .ticker-track{animation-play-state:paused;}
@keyframes scrollTicker{from{transform:translate3d(0,0,0);}to{transform:translate3d(-50%,0,0);}}
/* Цвета текста подогнаны под ту же ленту в floxweb.html (её светлую тему) —
   там нейтральный серый на чёрной основе, а не фиолетовый var(--muted)/
   var(--night) этой страницы, поэтому здесь эти значения захардкожены. */
.tick{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:rgba(0,0,0,.45);white-space:nowrap;}
.tick .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.tick b{color:#111118;font-weight:600;}
.tick .ago{color:rgba(0,0,0,.22);}

/* ── лоадер ── */
.loader-wrap{padding:60px 20px;text-align:center;color:var(--muted);font-size:14px;}
.error-wrap{padding:40px 20px;text-align:center;}
.error-title{font-size:18px;font-weight:700;margin-bottom:8px;}
.error-sub{font-size:13px;color:var(--muted);}

/* ── предупреждение внизу страницы ── */
/* Линия того же цвета (var(--line)), что и у бегущей строки вверху
   страницы, — визуально "закрывает" страницу тем же акцентом, каким она
   открывается. 14.07.26: раньше отступ до плашки был margin-top (32px) —
   это оставляло полосу БЕЛОГО фона страницы над тёмной плашкой, especially
   заметную, когда вариантов мало и контент короткий. Перенесли этот отступ
   внутрь плашки (padding-top), чтобы всё это пространство было закрашено
   тем же тёмным цветом, что и сама плашка-предупреждение, а не белым. */
.footer-notice{border-top:0.5px solid var(--line);padding:56px 20px 24px;background:var(--night);}
.footer-notice-text{max-width:640px;margin:0 auto;text-align:center;font-size:12.5px;line-height:1.6;color:#fff;}
</style>
</head>
<body>

<div class="top-bar" id="topBar" style="display:none">
  <div class="top-bar-inner">
    <div class="agent-avatar" id="agentAvatar"></div>
    <div class="agent-name" id="agentName"></div>
  </div>
</div>

<div class="ticker-wrap" id="soldTickerWrap" style="display:none">
  <div class="ticker-track" id="soldTicker"></div>
</div>

<div class="intro" id="intro" style="display:none">
  <div class="intro-title" id="introTitle"></div>
  <div class="intro-sub" id="introSub"></div>
</div>

<div class="sticky-footer-wrap" id="stickyFooterWrap">
  <div id="main">
    <div class="loader-wrap">Загружаем подборку…</div>
  </div>

  <div class="footer-notice">
    <div class="footer-notice-text">
      Наличие юнитов может измениться в любой момент — актуальный статус лучше уточнять у вашего агента
    </div>
  </div>
</div>

<script>

function fmtMln(n) {
  if (!n) return '—';
  return n >= 1000000 ? (n/1e6).toFixed(2).replace(/\.?0+$/, '') + ' млн ฿' : Math.round(n).toLocaleString('ru') + ' ฿';
}

// Крупная цена на карточке видна сразу (до наведения) — без десятых,
// целым числом миллионов, чтобы она хорошо читалась издалека.
function fmtMlnWhole(n) {
  if (!n) return '—';
  return n >= 1000000 ? Math.round(n/1e6) + ' млн ฿' : Math.round(n).toLocaleString('ru') + ' ฿';
}

function catRu(rt) {
  if (!rt) return '—';
  const s = rt.toLowerCase();
  if (s.includes('studio')) return 'Студия';
  if (s.includes('plus')) return '1 спальня+';
  if (s.includes('2 bedroom') || s.includes('2br')) return '2 спальни';
  if (s.includes('3 bedroom')) return '3 спальни';
  if (s.includes('ph') || s.includes('penthouse')) return 'Пентхаус';
  if (s.includes('1 bedroom') || s.includes('1br')) return '1 спальня';
  return rt;
}

// ── Карусель ──────────────────────────────────────────────────
function initCarousel(card, slides) {
  const plan = card.querySelector('.unit-plan');
  const placeholder = plan.querySelector('.unit-plan-placeholder');
  if (placeholder) placeholder.remove();

  const track = document.createElement('div');
  track.className = 'unit-track';
  slides.forEach(s => {
    const slide = document.createElement('div');
    slide.className = 'unit-slide';
    const img = document.createElement('img');
    img.src = s.path; img.alt = s.label;
    slide.appendChild(img);
    track.appendChild(slide);
  });
  plan.appendChild(track);

  if (slides.length > 1) {
    const labelEl = document.createElement('div');
    labelEl.className = 'slide-label';
    labelEl.textContent = slides[0].label;
    plan.appendChild(labelEl);

    const arL = document.createElement('div');
    arL.className = 'slide-arrow left';
    arL.innerHTML = '<i class="ti ti-chevron-left"></i>';
    const arR = document.createElement('div');
    arR.className = 'slide-arrow right';
    arR.innerHTML = '<i class="ti ti-chevron-right"></i>';
    plan.appendChild(arL); plan.appendChild(arR);

    let cur = 0;
    let sx = 0, dx = 0, dragging = false;

    // Карусель зациклена (доходит до конца — начинает заново), поэтому
    // стрелки никогда не блокируются на первой/последней картинке: раньше
    // стрелка "вправо" гасла (opacity:0 + pointer-events:none) на последнем
    // слайде — из-за этого наведение на неё переставало долетать до самой
    // стрелки (браузер видел под курсором картинку позади), и автопролистывание
    // не ставилось на паузу, стоило автоплею докрутить до конца.
    function goTo(idx) {
      cur = ((idx % slides.length) + slides.length) % slides.length;
      track.style.transform = `translateX(-${cur * 100}%)`;
      labelEl.textContent = slides[cur].label;
    }
    arL.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); goTo(cur - 1); });
    arR.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); goTo(cur + 1); });

    plan.addEventListener('touchstart', e => { sx = e.touches[0].clientX; dragging = true; track.style.transition = 'none'; }, { passive: true });
    plan.addEventListener('touchmove', e => { if (!dragging) return; dx = e.touches[0].clientX - sx; track.style.transform = `translateX(calc(-${cur*100}% + ${dx}px))`; }, { passive: true });
    plan.addEventListener('touchend', () => { dragging = false; track.style.transition = 'transform .3s ease'; if (Math.abs(dx) > 50) goTo(cur + (dx < 0 ? 1 : -1)); else goTo(cur); dx = 0; });

    // Автопролистывание вправо по наведению на планировку — доходит до конца
    // и начинает круг заново с первой картинки. Наведение на сами стрелки
    // ставит автопролистывание на паузу (ими листают вручную), возобновляется
    // при уходе курсора со стрелки обратно на планировку.
    let autoTimer = null;
    let planHovered = false;
    function startAutoplay() {
      if (autoTimer) return;
      autoTimer = setInterval(() => { goTo((cur + 1) % slides.length); }, 1400);
    }
    function stopAutoplay() {
      if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
    }
    plan.addEventListener('mouseenter', () => { planHovered = true; startAutoplay(); });
    plan.addEventListener('mouseleave', () => { planHovered = false; stopAutoplay(); });
    arL.addEventListener('mouseenter', stopAutoplay);
    arR.addEventListener('mouseenter', stopAutoplay);
    arL.addEventListener('mouseleave', () => { if (planHovered) startAutoplay(); });
    arR.addEventListener('mouseleave', () => { if (planHovered) startAutoplay(); });

    // Автопролистывание запускается не только по наведению на саму
    // картинку, но и по наведению на инфоблок (проект/номер/цена) — это
    // тот же элемент, что раскрывает подробности (см. initHoverExpand) —
    // а также на саму раскрывшуюся по наведению всплывающую информацию
    // (точная цена, корпус/этаж/тип/площадь) — иначе стоило курсору
    // спуститься с инфоблока на раскрывшийся текст под ним (тот же курсор,
    // та же карточка), автопролистывание останавливалось, хотя пользователь
    // с карточки никуда не уходил.
    const summary = card.querySelector('.unit-summary');
    const hoverExtra = card.querySelector('.unit-hover-extra');
    [summary, hoverExtra].forEach(el => {
      if (!el) return;
      el.addEventListener('mouseenter', () => { planHovered = true; startAutoplay(); });
      el.addEventListener('mouseleave', () => { planHovered = false; stopAutoplay(); });
    });

    // Если мышь ушла с карточки юнита целиком (не наведена ни на планировку,
    // ни на стрелки, ни на цену/кнопку) и за 4 секунды не вернулась — карусель
    // сама возвращается на первый слайд (планировку), чтобы карточка не
    // оставалась "залипшей" на случайном рендере.
    let resetTimer = null;
    card.addEventListener('mouseleave', () => {
      clearTimeout(resetTimer);
      resetTimer = setTimeout(() => { goTo(0); }, 4000);
    });
    card.addEventListener('mouseenter', () => clearTimeout(resetTimer));

    // 14.07.26: как и __collapseHoverExpand выше — planHovered/autoTimer
    // живут только в этом замыкании и обновляются только через реальные
    // mouseenter/mouseleave. Если уйти со страницы по клику на "Подробнее"
    // во время автопролистывания (мышь была над планировкой) и вернуться
    // назад стрелкой браузера — bfcache восстанавливает страницу как есть,
    // включая "замороженный" activeTimer, который тут же продолжает тикать
    // сам по себе, а planHovered остаётся true — карточка выглядит так, будто
    // застряла в состоянии наведения. Даём доступ к принудительному сбросу.
    card.__resetCarouselHover = () => {
      planHovered = false;
      stopAutoplay();
      clearTimeout(resetTimer);
      goTo(0);
    };
  }
}

// ── Masonry-раскладка карточек (JS) ─────────────────────────────
// Каждой карточке один раз назначается колонка (по порядку следования —
// как в исходном гриде слева направо), а её позиция (top) внутри этой
// колонки пересчитывается заново при каждом изменении высоты любой
// карточки. Так как колонка не меняется, при раскрытии одной карточки
// смещаются только карточки НИЖЕ неё в её же колонке — остальные колонки
// вообще не трогаются. Пересчёт полных колонок (число колонок, их ширина)
// происходит при первой отрисовке и при изменении размера окна.
const MGAP = 16, MIN_COL = 320;
// 14.07.26: последняя карточка в самой длинной колонке упиралась почти
// вплотную в предупреждение внизу страницы — .units{padding:16px} тут не
// спасает (карточки position:absolute, их отрисованная высота никак не
// ограничена контейнером, а .units{box-sizing:border-box} к тому же не
// добавляет свой bottom-padding поверх высоты, выставленной из JS). Резерв
// добавляется прямо в расчёт высоты контейнера — так гарантированно
// работает независимо от box-model нюансов.
const BOTTOM_SPACE = 40;
let mCols = 1, mColW = 0;
const cardCol = new Map();

function computeMasonryColumns() {
  const container = document.querySelector('.units');
  if (!container) return;
  const cw = container.clientWidth;
  mCols = Math.max(1, Math.floor((cw + MGAP) / (MIN_COL + MGAP)));
  mColW = (cw - MGAP * (mCols - 1)) / mCols;
}

function layoutMasonry(reassignColumns) {
  const container = document.querySelector('.units');
  if (!container) return;
  if (reassignColumns) computeMasonryColumns();
  const cards = [...container.querySelectorAll('.unit-card')];
  const colTops = new Array(mCols).fill(0);
  cards.forEach((card, i) => {
    let col = cardCol.get(card);
    if (reassignColumns || col === undefined) { col = i % mCols; cardCol.set(card, col); }
    card.style.width = mColW + 'px';
    card.style.left = (col * (mColW + MGAP)) + 'px';
    card.style.top = colTops[col] + 'px';
    colTops[col] += card.offsetHeight + MGAP;
  });
  container.style.height = Math.max(0, Math.max(...colTops) - MGAP + BOTTOM_SPACE) + 'px';
}

// Покадровый пересчёт раскладки на время CSS-transition раскрытия/сворачивания
// (450мс у .unit-hover-extra) — колонка не меняется, дальнейшая раскладка
// внутри неё просто следует за фактической высотой карточки каждый кадр.
function animateMasonry(durationMs) {
  const start = performance.now();
  function tick(now) {
    layoutMasonry(false);
    if (now - start < durationMs) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

let masonryResizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(masonryResizeTimer);
  masonryResizeTimer = setTimeout(() => layoutMasonry(true), 150);
});

// 22.07.26, по просьбе Ильи: при малом числе юнитов страница короче экрана,
// и под тёмной плашкой .footer-notice снизу оставалась белая полоса — тело
// документа было короче видимой области, а .footer-notice просто последний
// блок в обычном потоке. Пробовали чинить через body{display:flex}, но это
// зачем-то ломало отображение заголовка "Подборка для Вас" (см. правку от
// 22.07.26) — откатили. Вместо смены display у body/html просто досыпаем
// #main padding-bottom ровно на недостающую высоту (разница между высотой
// экрана и уже отрисованной высотой всей страницы) — ничего в display/потоке
// документа не меняется, побочных эффектов на другие блоки быть не должно.
// 22.07.26 (2), по просьбе Ильи: см. большой комментарий у .sticky-footer-wrap
// в CSS — вместо разового padding-снимка просто выставляем обёртке
// min-height ("сколько места остаётся до низа экрана от её начала"), а
// #main{flex:1 0 auto} внутри нее сам живо доращивает/уступает место под
// актуальную высоту контента, в любой момент после этого вызова.
function stickyFooterFix() {
  const wrap = document.getElementById('stickyFooterWrap');
  if (!wrap) return;
  const offsetTop = wrap.getBoundingClientRect().top + window.scrollY;
  wrap.style.minHeight = Math.max(0, window.innerHeight - offsetTop) + 'px';
}
window.addEventListener('resize', stickyFooterFix);
window.addEventListener('load', stickyFooterFix); // 22.07.26 (2): подстраховка на случай, если шрифты/что-то ещё доедет позже остальных вызовов

// ── Раскрытие полной инфы по наведению (кроме наведения прямо на кнопку) ──
// Триггер — планировка или сводка (проект/номер/цена), а не сама кнопка
// "Подробнее": иначе кнопка уезжала бы вниз вместе с раскрывающейся инфой
// прямо из-под курсора в момент, когда человек как раз хочет по ней нажать.
function initHoverExpand(card) {
  const triggers = card.querySelectorAll('.unit-plan, .unit-summary');
  const collapse = () => { card.classList.remove('expanded'); animateMasonry(500); };
  triggers.forEach(t => t.addEventListener('mouseenter', () => { card.classList.add('expanded'); animateMasonry(500); }));
  card.addEventListener('mouseleave', collapse);
  // 14.07.26: даём доступ к сворачиванию извне (см. resetAllCardHoverStates) —
  // это класс .expanded, включаемый только через mouseenter/mouseleave, а не
  // чистым CSS :hover (см. комментарий у .unit-hover-extra) — поэтому если
  // уйти со страницы по клику на "Подробнее" и вернуться назад стрелкой
  // браузера, реального mouseleave не было, и .expanded остаётся включённым
  // (карточка "зависает" раскрытой), пока мышь физически не пошевелится.
  card.__collapseHoverExpand = collapse;
}

// ── Сердечко "нравится" ──────────────────────────────────────
// Один делегированный обработчик клика на весь список карточек. Клик по
// пустому сердечку — лайк (пишем строку в presentation_likes, бот шлёт
// агенту уведомление в Telegram и запись появляется в "Последней
// активности" в floxweb.html). Клик по уже закрашенному сердечку — снятие
// лайка: помечаем строку unliked=true (саму строку не трогаем — её
// удаляет уже бот, ПОСЛЕ того как удалит отправленные им сообщения в
// Telegram, см. telegram_listener.py). Состояние (лайкнуто/нет + id
// строки в Supabase, он нужен, чтобы знать что помечать при снятии лайка)
// живёт в localStorage — переживает перезагрузку страницы по той же
// ссылке.
//
// Важно: используем Prefer: return=representation (не return=minimal, как
// у брони/показа) — иначе Supabase не вернёт id созданной строки, а без
// него нечего будет помечать unliked=true при снятии лайка.
//
// Ошибки запроса теперь логируются в консоль браузера (не просто
// проглатываются) — если лайки не доходят до бота/"Последней активности",
// открой консоль (F12 → Console) на странице оффера после клика по
// сердечку: там будет видно, что именно ответил Supabase (чаще всего это
// либо "таблицы не существует", либо ошибка доступа — RLS-политика не
// разрешает анонимную запись).
// 14.07.26: источник истины по "лайкнуто/нет" теперь Supabase, а не только
// localStorage — иначе лайк, поставленный на странице оффера, не был виден
// на странице юнита (unit.html), и наоборот: у каждой страницы свой
// localStorage-кэш, но сам факт лайка живёт в одной общей таблице
// presentation_likes.
//
// Возвращает null, если запрос не удался (сеть, RLS, таблицы ещё нет у
// агента) — это отдельное значение от "успешно получили пустой список",
// чтобы вызывающий код НЕ путал "не смогли проверить базу" с "в базе
// точно ничего нет" и не затирал по ошибке валидное состояние localStorage.
// ── Маленькое конфетти у сердечка при лайке ─────────────────────
// Срабатывает только когда сердечко становится красным (сам момент лайка,
// не при снятии). Используем ту же библиотеку canvas-confetti, что и
// unit.html для подтверждения брони/записи на показ — просто с маленьким
// количеством частиц и без разлёта на весь экран, чтобы это выглядело как
// акцент у самого сердечка, а не как салют. origin считается в долях
// viewport (0..1) из реальных координат кнопки (getBoundingClientRect),
// поэтому попадает точно в сердечко независимо от прокрутки страницы.
// Если библиотека почему-то не подгрузилась с CDN — просто ничего не
// происходит, сам лайк при этом всё равно ставится как обычно.
function spawnHeartConfetti(el) {
  if (!window.confetti) return;
  const rect = el.getBoundingClientRect();
  confetti({
    particleCount: 18,
    spread: 55,
    startVelocity: 18,
    scalar: 0.6,
    ticks: 120,
    origin: {
      x: (rect.left + rect.width / 2) / window.innerWidth,
      y: (rect.top + rect.height / 2) / window.innerHeight,
    },
    colors: ['#FF6B6B', '#7C3AED', '#FFC145', '#4ADE80', '#60A5FA'],
  });
}

async function fetchLikedUnitMap(presentationId) {
  if (!presentationId) return null;
  try {
    const r = await fetch(`${SB_URL}/presentation_likes?presentation_id=eq.${presentationId}&select=id,unit_id,unliked&order=id.desc`, { headers: HDR });
    const rows = await r.json();
    if (!Array.isArray(rows)) return null;
    const map = {};
    rows.forEach(row => {
      if (row.unliked) return; // лайк снят — не считаем активным
      if (row.unit_id != null && !(row.unit_id in map)) map[row.unit_id] = row.id;
    });
    return map;
  } catch (e) {
    console.error('presentation_likes GET (синхронизация сердечек) network error:', e);
    return null;
  }
}

async function initLikeButtons(presentationId) {
  // 13.07.26: ключи localStorage теперь именуются с presentationId, а не
  // только room — иначе один и тот же юнит (та же планировка), попавший в
  // РАЗНЫЕ презентации разных клиентов, "наследовал" лайк из одной
  // презентации в другую только потому, что открывались с одного браузера
  // (например, у самого агента при проверке новой подборки). Каждая
  // презентация/ссылка теперь хранит свои лайки независимо.
  //
  // 14.07.26: перед тем как полагаться на localStorage, сверяемся с
  // Supabase (см. fetchLikedUnitMap) — это единственный способ синхронизировать
  // сердечко между офером и страницей юнита (unit.html): разные страницы,
  // разный localStorage-кэш, но одна и та же строка в presentation_likes
  // как источник истины. Если запрос не удался — likedMap будет null, и мы
  // просто доверяем localStorage как раньше, ничего не перезаписывая.
  const likedMap = await fetchLikedUnitMap(presentationId);
  document.querySelectorAll('.unit-like').forEach(el => {
    const room = el.dataset.room;
    const unitId = el.dataset.unitId;
    const likedKey = `flox-liked-${presentationId}-${room}`;
    const rowIdKey = `flox-liked-id-${presentationId}-${room}`;

    if (likedMap != null) {
      const dbRowId = unitId && Object.prototype.hasOwnProperty.call(likedMap, unitId) ? likedMap[unitId] : null;
      if (dbRowId != null) {
        // В базе есть активный лайк (возможно, поставлен на другой
        // странице) — синхронизируем localStorage, чтобы "снять лайк"
        // дальше работал как обычно (нужен id строки).
        localStorage.setItem(likedKey, 'true');
        localStorage.setItem(rowIdKey, dbRowId);
      } else {
        // Запрос точно удался и в базе для этого юнита активного лайка
        // нет (не ставили или сняли на другой странице) — синхронизируем
        // localStorage в обратную сторону, гасим сердечко.
        localStorage.removeItem(likedKey);
        localStorage.removeItem(rowIdKey);
      }
    }

    if (localStorage.getItem(likedKey) === 'true') {
      el.classList.add('liked');
      const icon = el.querySelector('i');
      if (icon) icon.className = 'ti ti-heart-filled';
    }
  });
  document.querySelector('.units')?.addEventListener('click', async e => {
    const btn = e.target.closest('.unit-like');
    if (!btn) return;
    e.preventDefault();
    e.stopPropagation();
    const room = btn.dataset.room;
    const unitId = btn.dataset.unitId;
    const icon = btn.querySelector('i');
    const likedKey = `flox-liked-${presentationId}-${room}`;
    const rowIdKey = `flox-liked-id-${presentationId}-${room}`;

    if (btn.classList.contains('liked')) {
      // Снимаем лайк
      const rowId = localStorage.getItem(rowIdKey);
      btn.classList.remove('liked');
      if (icon) icon.className = 'ti ti-heart';
      localStorage.removeItem(likedKey);
      localStorage.removeItem(rowIdKey);
      if (!rowId) return; // лайк был поставлен ещё до этого обновления офера — id неизвестен, снимать в базе нечего
      try {
        const resp = await fetch(`${SB_URL}/presentation_likes?id=eq.${rowId}`, {
          method: 'PATCH',
          headers: { ...HDR, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
          body: JSON.stringify({ unliked: true }),
        });
        if (!resp.ok) console.error('presentation_likes PATCH (снятие лайка) failed:', resp.status, await resp.text());
      } catch (e) {
        console.error('presentation_likes PATCH (снятие лайка) network error:', e);
      }
      return;
    }

    // Ставим лайк
    btn.classList.add('liked');
    if (icon) icon.className = 'ti ti-heart-filled';
    spawnHeartConfetti(btn);
    localStorage.setItem(likedKey, 'true');
    try {
      const resp = await fetch(`${SB_URL}/presentation_likes`, {
        method: 'POST',
        headers: { ...HDR, 'Content-Type': 'application/json', Prefer: 'return=representation' },
        body: JSON.stringify({ presentation_id: presentationId, unit_id: unitId || null }),
      });
      if (!resp.ok) {
        console.error('presentation_likes POST failed:', resp.status, await resp.text());
        return;
      }
      const rows = await resp.json();
      if (rows && rows[0] && rows[0].id != null) localStorage.setItem(rowIdKey, rows[0].id);
    } catch (e) {
      console.error('presentation_likes POST network error:', e);
    }
  });
}

// ── Живое обновление сердечек между открытыми вкладками (Supabase Realtime) ──
// Дополнительный слой ПОВЕРХ initLikeButtons(): та же подборка может быть
// открыта в другой вкладке (например, страница юнита — unit.html) в этот же
// момент. Без Realtime лайк там появился бы только после перезагрузки —
// с ним появляется сразу, пока обе вкладки открыты.
//
// ВАЖНО: чтобы это заработало, в Supabase для таблицы presentation_likes
// должна быть включена репликация — Database → Replication → включить
// таблицу presentation_likes в публикацию supabase_realtime (обычно она
// называется именно так и создаётся Supabase по умолчанию для проекта, но
// конкретные таблицы в неё нужно добавлять вручную). Если это не сделано —
// подписка просто не получит ни одного события и молча ничего не будет
// происходить; вся остальная механика (REST-запросы, localStorage, сверка
// с базой при загрузке страницы) продолжит работать как прежде, эта часть
// не критична для остального функционала.
function subscribeLikeRealtime(presentationId) {
  if (typeof supabase === 'undefined' || !presentationId) return; // библиотека не загрузилась или нет id презентации — молча пропускаем
  try {
    const sbClient = supabase.createClient(SB_URL.replace(/\/rest\/v1\/?$/, ''), SB_KEY);
    sbClient
      .channel(`presentation_likes:${presentationId}`)
      .on('postgres_changes', {
        event: '*',
        schema: 'public',
        table: 'presentation_likes',
        filter: `presentation_id=eq.${presentationId}`,
      }, payload => applyLikeRealtimeEvent(payload, presentationId))
      .subscribe();
  } catch (e) {
    console.error('Realtime подписка на presentation_likes не удалась:', e);
  }
}

function applyLikeRealtimeEvent(payload, presentationId) {
  const isDelete = payload.eventType === 'DELETE';
  const row = isDelete ? payload.old : payload.new;
  if (!row || row.unit_id == null) return;

  const btn = document.querySelector(`.unit-like[data-unit-id="${row.unit_id}"]`);
  if (!btn) return; // этого юнита нет на текущей странице — не наша забота

  const room = btn.dataset.room;
  const likedKey = `flox-liked-${presentationId}-${room}`;
  const rowIdKey = `flox-liked-id-${presentationId}-${room}`;
  const icon = btn.querySelector('i');
  const isActiveLike = !isDelete && !row.unliked;

  if (isActiveLike) {
    btn.classList.add('liked');
    if (icon) icon.className = 'ti ti-heart-filled';
    localStorage.setItem(likedKey, 'true');
    localStorage.setItem(rowIdKey, row.id);
  } else {
    btn.classList.remove('liked');
    if (icon) icon.className = 'ti ti-heart';
    localStorage.removeItem(likedKey);
    localStorage.removeItem(rowIdKey);
  }
}

async function loadSlides(u, projCode, proj) {
  const TOWER_CYR = { A: 'а', B: 'б', C: 'с', D: 'д' };
  const slides = [];

  if (projCode && u.plan_code && u.area_sqm) {
    slides.push({ path: `${BASE}img/${projCode}/units/${encodeURIComponent(Number(u.area_sqm).toFixed(2)+'_'+u.plan_code+'.jpg')}`, label: 'Планировка' });
  }
  if (projCode && u.tower && u.floor) {
    const tc = TOWER_CYR[String(u.tower).toUpperCase()] || String(u.tower).toLowerCase();
    slides.push({ path: `${BASE}img/${projCode}/floor-plans/${encodeURIComponent(tc+u.floor+'.jpg')}`, label: `Поэтажный план · Этаж ${u.floor}` });
  }
  if (projCode && u.floor) {
    const p = String(Number(u.floor)+1).padStart(4,'0');
    slides.push({ path: `${BASE}img/${projCode}/masterplan/${encodeURIComponent('мастер план_page-'+p+'.jpg')}`, label: `Мастер-план · Этаж ${u.floor}` });
  }

  // Все картинки блока "Рендеры: экстерьер" проекта (не только первая).
  // В project.html этот блок строится как gallery.local.slice(0, 9) (см.
  // renderVisual()) — то есть первые 9 файлов общего списка gallery.local
  // это и есть "экстерьер". Добавляем их все отдельными слайдами.
  const galleryLocal = proj?.gallery?.local;
  if (projCode && Array.isArray(galleryLocal) && galleryLocal.length) {
    galleryLocal.slice(0, 9).forEach(f => {
      const path = typeof f === 'string' && f.startsWith('http') ? f : `${BASE}img/${projCode}/${f}`;
      slides.push({ path, label: 'Экстерьер' });
    });
  }

  const found = await Promise.all(slides.map(s => new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(s);
    img.onerror = () => resolve(null);
    img.src = s.path;
  })));
  return found.filter(Boolean);
}

// ── Инициалы агента (для аватара вместо логотипа) ─────────────
function computeInitials(fullName) {
  if (!fullName) return '';
  return fullName.trim().split(/\s+/).map(w => w[0]).filter(Boolean).slice(0, 2).join('').toUpperCase();
}

// ── Бегущая строка "недавно продано" ────────────────────────────
// Не привязана к конкретной подборке — соц. доказательство того, что
// объекты по всему каталогу реально продаются. Не блокирует основную
// загрузку подборки: запускается параллельно, независимо от неё.
const PROJ_COLOR = { VIK: '#C9A84C', KAT: '#7BAF6E', BAN: '#6B9BC2', OLN: '#8FAB5F' };
function soldTimeAgo(iso) {
  const mins = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 60000));
  if (mins < 60) return `${mins} мин назад`;
  const hours = Math.floor(mins / 60);
  if (hours < 24) return `${hours} ч назад`;
  const days = Math.floor(hours / 24);
  return `${days} дн назад`;
}
async function loadSoldTicker() {
  try {
    const r = await fetch(`${SB_URL}/units?status=eq.sold&select=room_no,status_updated_at,projects(code,name)&order=status_updated_at.desc&limit=25`, { headers: HDR });
    const rows = await r.json();
    if (!Array.isArray(rows) || !rows.length) return;
    const items = rows.map(u => {
      const code = u.projects?.code || '';
      const color = PROJ_COLOR[code] || 'var(--accent)';
      const projName = u.projects?.name || code;
      return `<span class="tick"><span class="dot" style="background:${color}"></span>ПРОДАНО <b>${u.room_no}</b> · ${projName} <span class="ago">· ${soldTimeAgo(u.status_updated_at)}</span></span>`;
    }).join('');
    const track = document.getElementById('soldTicker');
    track.innerHTML = items + items;
    document.getElementById('soldTickerWrap').style.display = 'block';
    requestAnimationFrame(() => {
      const singleWidth = track.scrollWidth / 2;
      const pxPerSecond = 38;
      track.style.animationDuration = Math.max(10, singleWidth / pxPerSecond) + 's';
    });
  } catch (e) {}
}

// ── Главная логика ────────────────────────────────────────────
async function init() {
  loadSoldTicker();
  const id = new URLSearchParams(location.search).get('id');
  if (!id) { showError('Неверная ссылка'); return; }

  const r = await fetch(`${SB_URL}/presentations?id=eq.${id}&select=*`, { headers: HDR });
  const rows = await r.json();
  if (!rows.length) { showError('Подборка не найдена или ссылка устарела'); return; }
  const pres = rows[0];

  // Логируем каждый просмотр
  fetch(`${SB_URL}/presentation_views`, {
    method: 'POST',
    headers: { ...HDR, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
    body: JSON.stringify({ presentation_id: id })
  }).catch(() => {});

  const units_meta = pres.units || [];

  if (!units_meta.length) { showError('В подборке нет юнитов'); return; }

  const roomNos = units_meta.map(u => u.room_no);
  const ur = await fetch(`${SB_URL}/units?room_no=in.(${roomNos.map(r=>`"${r}"`).join(',')})&select=id,room_no,tower,floor,room_type,area_sqm,selling_price,price_per_sqm,status,plan_code`, { headers: HDR });
  const units = await ur.json();

  const projectIds = [...new Set(units_meta.map(u => u.project).filter(Boolean))];
  const projMap = {};
  for (const pid of projectIds) {
    try {
      const pj = await fetch(`${BASE}projects/${pid}.json`);
      if (pj.ok) projMap[pid] = await pj.json();
    } catch(e) {}
  }

  // Инициалы + имя агента — вместо логотипа Flox (белый лейбл, клиент не
  // должен видеть брендинг сервиса). Если агента нет/не нашёлся — просто не
  // показываем шапку вообще, а не пустую тёмную полосу.
  let agentInitials = '';
  let agentFullName = '';
  if (pres.agent_id) {
    try {
      const ar = await fetch(`${SB_URL}/agents?id=eq.${pres.agent_id}&select=full_name`, { headers: HDR });
      const agents = await ar.json();
      if (agents.length) {
        agentFullName = agents[0].full_name || '';
        agentInitials = computeInitials(agentFullName);
      }
    } catch(e) {}
  }
  if (agentInitials) {
    document.getElementById('agentAvatar').textContent = agentInitials;
    document.getElementById('agentName').textContent = agentFullName
      ? `${agentFullName} — ваш личный агент по недвижимости`
      : '';
    document.getElementById('topBar').style.display = 'block';
  }

  // Вступление — унифицированный текст (без подстановки конкретного имени
  // клиента из базы), одинаковый для всех.
  const count = units.length;
  const countLabel = `${count} вариант${count === 1 ? '' : count < 5 ? 'а' : 'ов'}`;
  document.getElementById('introTitle').textContent = 'Подборка для Вас';
  document.getElementById('introSub').textContent = `${countLabel}, подобранных специально под ваш запрос`;
  document.getElementById('intro').style.display = 'block';

  const html = units_meta.map(meta => {
    const u = units.find(x => x.room_no === meta.room_no);
    if (!u) return '';
    const proj = projMap[meta.project];
    const isAvail = u.status === 'available';
    const cat = catRu(u.room_type);
    const projName = proj?.name || meta.project || '';
    const exactPrice = u.selling_price ? Math.round(u.selling_price).toLocaleString('ru') + ' ฿' : '—';
    const pricePerSqm = u.price_per_sqm ? Math.round(u.price_per_sqm).toLocaleString('ru') + ' ฿' : '—';
    const unitUrl = `unit.html?unit=${encodeURIComponent(u.room_no)}&project=${encodeURIComponent(meta.project || '')}&client=1${agentInitials ? '&agent=' + encodeURIComponent(agentInitials) : ''}${agentFullName ? '&agentName=' + encodeURIComponent(agentFullName) : ''}&pres=${encodeURIComponent(id)}`;

    // 20.07.26, по просьбе Ильи: если юнит продался ПОСЛЕ того, как подборка
    // была сформирована — карточка должна не просто выглядеть блёклой
    // (unit-sold-card уже было), а реально не пускать в клиентскую страницу
    // юнита. Раньше href стоял всегда, независимо от статуса — блёклая
    // карточка была кликабельной. isAvail здесь берётся из ЖИВОГО статуса
    // (запрос к units чуть выше, а не из "units" внутри самой презентации),
    // поэтому если юнит потом снова стал доступен — ссылка сама вернётся.
    const linkAttrs = isAvail ? `href="${unitUrl}" target="_blank" rel="noopener"` : '';

    return `<a class="unit-card${isAvail ? '' : ' unit-sold-card'}" id="uc-${u.room_no}" ${linkAttrs}>
      <div class="unit-plan">
        <div class="unit-plan-placeholder">
          <i class="ti ti-layout-2"></i>
          <span>Загружаем план…</span>
        </div>
        <span class="unit-badge ${isAvail ? 'badge-avail' : 'badge-sold'}">${isAvail ? `<span class="badge-dot" style="--dot-delay:${(Math.random()*1.8).toFixed(2)}s"></span>` : ''}${isAvail ? 'Свободен' : 'Продан'}</span>
      </div>
      <div class="unit-info">
        <span class="unit-like" data-unit-id="${u.id || ''}" data-room="${u.room_no}" aria-label="Нравится">
          <i class="ti ti-heart"></i>
        </span>
        <div class="unit-summary">
          <div class="unit-proj">${projName}</div>
          <div class="unit-num">${u.room_no}</div>
          <div class="unit-price-big">${fmtMlnWhole(u.selling_price)}</div>
        </div>
        <div class="unit-hover-extra">
          <div class="unit-price-exact">${exactPrice}</div>
          <div class="unit-full-rows">
            <div class="unit-full-row"><span>Корпус</span><b>${u.tower || '—'}</b></div>
            <div class="unit-full-row"><span>Этаж</span><b>${u.floor}${proj?.floors ? ' / '+proj.floors : ''}</b></div>
            <div class="unit-full-row"><span>Тип</span><b>${cat}</b></div>
            <div class="unit-full-row"><span>Площадь</span><b>${u.area_sqm} м²</b></div>
            <div class="unit-full-row"><span>За м²</span><b>${pricePerSqm}</b></div>
            <div class="unit-full-row"><span>Номер</span><b>${u.room_no}</b></div>
            <div class="unit-full-row"><span>Статус</span><b class="${isAvail ? 'green' : 'red'}">${isAvail ? 'Свободен' : 'Продан'}</b></div>
          </div>
        </div>
        <span class="unit-cta">Подробнее <i class="ti ti-arrow-right"></i></span>
      </div>
    </a>`;
  }).join('');

  document.getElementById('main').innerHTML = `<div class="units">${html}</div>`;

  initLikeButtons(id);
  subscribeLikeRealtime(id);

  // Раскрытие полной инфы по наведению — вешаем на каждую карточку сразу,
  // независимо от того, найдутся ли для неё картинки планировки.
  document.querySelectorAll('.unit-card').forEach(initHoverExpand);

  // Первичная masonry-раскладка (назначает колонки и расставляет карточки) —
  // до подгрузки картинок, чтобы страница не показывала карточки друг на
  // друге (позиции пересчитаются, но структура/размер карточек уже готовы).
  layoutMasonry(true);
  stickyFooterFix();

  // Загружаем слайды для каждого юнита — параллельно (Promise.all), а не
  // по очереди (было: for...of с await внутри цикла, т.е. проверка картинок
  // следующей карточки не начиналась, пока не закончится предыдущая).
  // Именно из-за этой последовательной очереди карусель (а с ней и
  // автопролистывание/обработчики наведения — см. initCarousel) у карточек
  // в конце списка появлялась с заметной задержкой: если навести на такую
  // карточку рано, у неё ещё даже не было слушателя наведения, отсюда и
  // ощущение "первое наведение долгое". Теперь все проверки картинок для
  // всех карточек идут одновременно, и вся подборка становится интерактивной
  // намного быстрее.
  await Promise.all(units_meta.map(async meta => {
    const u = units.find(x => x.room_no === meta.room_no);
    if (!u) return;
    const card = document.getElementById(`uc-${u.room_no}`);
    if (!card) return;
    const slides = await loadSlides(u, meta.project, projMap[meta.project]);
    if (slides.length) {
      initCarousel(card, slides);
    } else {
      const ph = card.querySelector('.unit-plan-placeholder');
      if (ph) ph.querySelector('span').textContent = 'Планировка появится позже';
    }
  }));

  // Финальный пересчёт раскладки — на случай, если высота карточек чуть
  // изменилась после подгрузки слайдов (шрифты/иконки и т.п.).
  layoutMasonry(true);
  stickyFooterFix();
}

function showError(msg) {
  document.getElementById('main').innerHTML = `<div class="error-wrap">
    <div class="error-title">Что-то пошло не так</div>
    <div class="error-sub">${msg}</div>
  </div>`;
  stickyFooterFix();
}

// ── Фикс "залипшей" карточки после возврата на страницу ─────────
// 14.07.26 (v2): первая версия этого фикса перекрывала страницу прозрачным
// слоем, рассчитывая на то, что дело в нативном CSS :hover — не помогло.
// Реальная причина иначе: раскрытие подробностей (.expanded) и
// автопролистывание планировки управляются не чистым CSS :hover, а JS
// (mouseenter/mouseleave, см. initHoverExpand и initCarousel). Если уйти со
// страницы кликом на "Подробнее", пока мышь была над карточкой, настоящего
// mouseleave не происходит — карточка так и остаётся "раскрытой", с
// работающим автопролистыванием. При возврате назад стрелкой браузера
// (bfcache) или переключении вкладки страница восстанавливается ровно в
// этом состоянии и выглядит "зависшей", пока курсор не шевельнётся и не
// вызовет настоящий mouseleave. Чиним явно — сворачиваем и сбрасываем
// каждую карточку сразу при возврате, не дожидаясь мыши.
function resetAllCardHoverStates() {
  document.querySelectorAll('.unit-card').forEach(card => {
    card.__collapseHoverExpand?.();
    card.__resetCarouselHover?.();
  });
  // На всякий случай — если "залип" именно нативный :hover (например, на
  // стрелках слайдера), мгновенное перекрытие страницы прозрачным слоем
  // заставляет браузер заново определить, что сейчас под курсором.
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;z-index:2147483647;';
  document.body.appendChild(overlay);
  requestAnimationFrame(() => overlay.remove());
}
window.addEventListener('pageshow', e => { if (e.persisted) resetAllCardHoverStates(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') resetAllCardHoverStates(); });

init();
</script>
